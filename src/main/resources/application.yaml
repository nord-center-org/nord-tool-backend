spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # E-mail (recuperação de senha e avisos de cadastro). Sem NORD_MAIL_USERNAME o envio fica desligado (só log).
  # Gmail: NORD_MAIL_USERNAME=conta@gmail.com e NORD_MAIL_PASSWORD=<senha de app de 16 letras> (não a senha normal).
  mail:
    host: ${NORD_MAIL_HOST:smtp.gmail.com}
    port: ${NORD_MAIL_PORT:587}
    username: ${NORD_MAIL_USERNAME:}
    password: ${NORD_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      # Maior arquivo aceito: PDF de termo e contrato (15 MB). Cada tipo tem o seu limite em ArquivoValidador.
      max-file-size: 16MB
      max-request-size: 17MB

server:
  # O contrato de erro é do GlobalExceptionHandler; a página de erro padrão nunca expõe detalhes.
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

logging:
  pattern:
    # idCorrelacao vem do CorrelacaoFilter (header X-Request-Id) e aparece também nas respostas de erro.
    level: "%5p [%X{idCorrelacao:-}]"

nord-tool:
  cors:
    # Origens do frontend autorizadas; cada perfil define a sua lista (sem padrão aberto).
    allowed-origins:
  security:
    # Autenticação sempre exigida. Fora do perfil local o startup falha sem chave JWT.
    # NORD_JWT_KEYS="kid1:<base64 de 32+ bytes>;kid2:..." e NORD_JWT_ACTIVE_KID=kid1 (rotação: ver README).
    jwt-keys: ${NORD_JWT_KEYS:}
    active-kid: ${NORD_JWT_ACTIVE_KID:}
    # Compatibilidade: chave única em texto (32+ bytes), usada só se NORD_JWT_KEYS estiver vazia.
    jwt-secret: ${NORD_JWT_SECRET:}
    access-token-minutes: ${NORD_ACCESS_TOKEN_MINUTES:15}
    session-max-hours: ${NORD_SESSION_MAX_HOURS:2}
  admin:
    # Bootstrap do primeiro ADMIN (só roda com a tabela usuario vazia). Remover as variáveis depois.
    email: ${NORD_ADMIN_EMAIL:}
    name: ${NORD_ADMIN_NAME:}
    password: ${NORD_ADMIN_PASSWORD:}
  cotacao:
    # Cotação dos fundos (brapi.dev, plano gratuito). Sem token só alguns tickers respondem; o token nunca é exposto à API.
    url: ${NORD_COTACAO_URL:https://brapi.dev/api}
    token: ${NORD_COTACAO_TOKEN:}
    ttl-seconds: ${NORD_COTACAO_TTL_SEGUNDOS:60}
    timeout-seconds: ${NORD_COTACAO_TIMEOUT_SEGUNDOS:5}
  mail:
    # Remetente exibido; padrão = NORD_MAIL_USERNAME.
    from: ${NORD_MAIL_FROM:${NORD_MAIL_USERNAME:}}
  # Endereço do frontend, usado no link de redefinição de senha (ex.: https://nordtool.up.railway.app).
  app-url: ${NORD_APP_URL:}
  storage:
    # Provedor de arquivos: POSTGRES (provisório). Definitivo ainda a decidir (Drive/S3).
    provider: ${NORD_STORAGE_PROVIDER:POSTGRES}
  lugia:
    # Chat multi-IA. Cada provedor aparece com chave + ao menos um modelo. Chaves só pelo ambiente.
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    openai-api-key: ${OPENAI_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
    modelos-claude: ${LUGIA_MODELOS_CLAUDE:claude-opus-5-5,claude-sonnet-5-5}
    # Sem padrão para a OpenAI: os ids mudam com frequência; use os que a sua chave acessa.
    modelos-openai: ${LUGIA_MODELOS_OPENAI:}
    modelos-gemini: ${LUGIA_MODELOS_GEMINI:gemini-flash-latest}
    # Gratuitos (só texto): Groq (rápido, sem cartão), OpenRouter ("openrouter/free" escolhe um modelo gratuito),
    # Mistral (plano Experiment) e NVIDIA (build.nvidia.com). O Gemini também entra no modo Automático.
    groq-api-key: ${GROQ_API_KEY:}
    modelos-groq: ${LUGIA_MODELOS_GROQ:openai/gpt-oss-120b,llama-3.1-8b-instant}
    openrouter-api-key: ${OPENROUTER_API_KEY:}
    modelos-openrouter: ${LUGIA_MODELOS_OPENROUTER:openrouter/free}
    mistral-api-key: ${MISTRAL_API_KEY:}
    modelos-mistral: ${LUGIA_MODELOS_MISTRAL:mistral-small-latest}
    nvidia-api-key: ${NVIDIA_API_KEY:}
    modelos-nvidia: ${LUGIA_MODELOS_NVIDIA:meta/llama-3.3-70b-instruct}
    # Modo Automático: ordem dos modelos (ids separados por vírgula). Vazio = todos os gratuitos com chave,
    # na ordem Gemini, Groq, OpenRouter, Mistral, NVIDIA. Quem bate no limite fica de fora até a cota voltar.
    cadeia-automatico: ${LUGIA_CADEIA_AUTOMATICO:}
    anexo-max-mb: ${LUGIA_ANEXO_MAX_MB:10}
    # Agente executor (ADMIN do módulo LUGIA): token fine-grained do GitHub com Contents e Pull requests (leitura e escrita)
    # nos repositórios da organização. Agente, ambiente e vault são criados no primeiro uso e guardados em lugia_configuracao.
    github-token: ${LUGIA_GITHUB_TOKEN:}
    repositorios: ${LUGIA_REPOSITORIOS:}
    modelo-agente: ${LUGIA_MODELO_AGENTE:claude-opus-5-5}
    agente-id: ${LUGIA_AGENTE_ID:}
    ambiente-id: ${LUGIA_AMBIENTE_ID:}
    vault-id: ${LUGIA_VAULT_ID:}
