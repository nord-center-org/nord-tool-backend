spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

nord-tool:
  cors:
    # Origens do frontend autorizadas; cada perfil define a sua lista (sem padrão aberto).
    allowed-origins:
  security:
    # Chave de liga/desliga: false mantém a API aberta (publicar backend antes do frontend)
    enabled: ${NORD_SECURITY_ENABLED:false}
    jwt-secret: ${NORD_JWT_SECRET:}
    inactivity-minutes: ${NORD_INACTIVITY_MINUTES:30}
  admin:
    # Bootstrap do primeiro ADMIN (só roda com a tabela usuario vazia). Remover as variáveis depois.
    email: ${NORD_ADMIN_EMAIL:}
    name: ${NORD_ADMIN_NAME:}
    password: ${NORD_ADMIN_PASSWORD:}
  cotacao:
    # Cotação dos fundos (brapi.dev, plano gratuito). Sem token só alguns tickers respondem; o token nunca é exposto à API.
    url: ${NORD_COTACAO_URL:https://brapi.dev/api}
    token: ${NORD_COTACAO_TOKEN:}
    ttl-seconds: ${NORD_COTACAO_TTL_SEGUNDOS:60}
    timeout-seconds: ${NORD_COTACAO_TIMEOUT_SEGUNDOS:5}
  storage:
    # Provedor de arquivos: POSTGRES (provisório). Definitivo ainda a decidir (Drive/S3).
    provider: ${NORD_STORAGE_PROVIDER:POSTGRES}
