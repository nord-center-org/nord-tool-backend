server:
  port: ${PORT:8080}

spring:
  application:
    name: nord-tool-backend

  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      minimum-idle: 1
      maximum-pool-size: 10
      idle-timeout: 300000
      max-lifetime: 1200000
      auto-commit: false
      initialization-fail-timeout: 0

nord-tool:
  cors:
    # Lista separada por vírgula. O padrão mantém o frontend publicado hoje até NORD_CORS_ORIGINS ser definida.
    allowed-origins: ${NORD_CORS_ORIGINS:https://nordtoolfrontend-develop.up.railway.app}

