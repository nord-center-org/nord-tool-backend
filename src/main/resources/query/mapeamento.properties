## Mapeamentos (contagem de campo e quantitativos). Escopo de fase igual aos demais módulos.

SPS.MAPEAMENTO.LISTAR=\
SELECT m.id_mapeamento AS id, m.cd_tipo AS cdTipo, m.nm_titulo AS nmTitulo, m.nm_local AS nmLocal, m.dt_mapeamento AS dtMapeamento, \
m.pc_tolerancia AS pcTolerancia, m.tx_observacao AS txObservacao, m.cd_status AS cdStatus, m.id_fase AS idFase, f.nm_fase AS nmFase, \
m.id_usuario_autor AS idAutor, u.nm_nome AS nmAutor, m.nr_versao AS nrVersao, \
(SELECT COUNT(*) FROM mapeamento_linha l WHERE l.id_mapeamento = m.id_mapeamento) AS qtLinhas \
FROM mapeamento m \
LEFT JOIN fase f ON f.id_fase = m.id_fase \
LEFT JOIN usuario u ON u.id_usuario = m.id_usuario_autor \
WHERE (:todasFases OR m.id_fase = ANY(CAST(string_to_array(:fasesCsv, ',') AS bigint[])) OR (:verSemFase AND m.id_fase IS NULL)) \
  AND (CAST(:id AS bigint) IS NULL OR m.id_mapeamento = :id) \
ORDER BY m.dt_mapeamento DESC, m.id_mapeamento DESC

SPS.MAPEAMENTO.LINHAS=\
SELECT id_linha AS id, id_mapeamento AS idMapeamento, nr_ordem AS nrOrdem, nm_grupo AS nmGrupo, nm_item AS nmItem, \
nm_unidade AS nmUnidade, qt_projeto AS qtProjeto, qt_medida AS qtMedida, qt_solicitada AS qtSolicitada, tx_observacao AS txObservacao \
FROM mapeamento_linha WHERE id_mapeamento = :idMapeamento ORDER BY nr_ordem, id_linha

SPI.MAPEAMENTO.INSERIR=\
INSERT INTO mapeamento (cd_tipo, id_fase, nm_titulo, nm_local, dt_mapeamento, pc_tolerancia, tx_observacao, id_usuario_autor) \
VALUES (:cdTipo, :idFase, :nmTitulo, :nmLocal, :dtMapeamento, :pcTolerancia, :txObservacao, :idAutor) RETURNING id_mapeamento

SPU.MAPEAMENTO.ALTERAR=\
UPDATE mapeamento SET nm_titulo = :nmTitulo, nm_local = :nmLocal, dt_mapeamento = :dtMapeamento, pc_tolerancia = :pcTolerancia, \
tx_observacao = :txObservacao, nr_versao = nr_versao + 1, dh_alteracao = now() \
WHERE id_mapeamento = :id AND nr_versao = :nrVersao

SPU.MAPEAMENTO.STATUS=\
UPDATE mapeamento SET cd_status = :cdStatus, nr_versao = nr_versao + 1, dh_alteracao = now() \
WHERE id_mapeamento = :id AND nr_versao = :nrVersao

SPD.MAPEAMENTO.DELETAR=\
DELETE FROM mapeamento WHERE id_mapeamento = :id AND nr_versao = :nrVersao

SPD.MAPEAMENTO.LINHAS.LIMPAR=\
DELETE FROM mapeamento_linha WHERE id_mapeamento = :idMapeamento

SPI.MAPEAMENTO.LINHA.INSERIR=\
INSERT INTO mapeamento_linha (id_mapeamento, nr_ordem, nm_grupo, nm_item, nm_unidade, qt_projeto, qt_medida, qt_solicitada, tx_observacao) \
VALUES (:idMapeamento, :nrOrdem, :nmGrupo, :nmItem, :nmUnidade, :qtProjeto, :qtMedida, :qtSolicitada, :txObservacao)
