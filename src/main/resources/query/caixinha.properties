## ---------- responsáveis ----------
SPS.CAIXINHA.RESPONSAVEL.LISTAR=\
SELECT id_responsavel AS id, nm_responsavel AS nmResponsavel, in_ativo AS inAtivo \
FROM caixinha_responsavel ORDER BY LOWER(nm_responsavel)

SPS.CAIXINHA.RESPONSAVEL.BUSCAR=\
SELECT id_responsavel AS id, nm_responsavel AS nmResponsavel, in_ativo AS inAtivo \
FROM caixinha_responsavel WHERE id_responsavel = :id

SPI.CAIXINHA.RESPONSAVEL.INSERIR=\
INSERT INTO caixinha_responsavel (nm_responsavel, in_ativo) VALUES (:nmResponsavel, :inAtivo)

SPU.CAIXINHA.RESPONSAVEL.ALTERAR=\
UPDATE caixinha_responsavel SET nm_responsavel = :nmResponsavel, in_ativo = :inAtivo WHERE id_responsavel = :id

## ---------- lançamentos ----------
## A cláusula WHERE dos filtros e o ORDER BY são acrescentados pelo repositório.
SPS.CAIXINHA.LANCAMENTO.LISTAR=\
SELECT l.id_lancamento AS id, l.cd_requisicao::text AS cdRequisicao, l.dt_lancamento AS dtLancamento, \
l.id_responsavel AS idResponsavel, r.nm_responsavel AS nmResponsavel, l.tx_insumo AS txInsumo, l.vl_valor AS vlValor, \
l.in_lancado AS inLancado, l.in_pago AS inPago, l.nr_versao AS nrVersao, l.dh_alteracao AS dhAlteracao, \
(SELECT COUNT(*) FROM caixinha_comprovante c WHERE c.id_lancamento = l.id_lancamento) AS qtComprovantes \
FROM caixinha_lancamento l JOIN caixinha_responsavel r ON r.id_responsavel = l.id_responsavel WHERE 1 = 1

SPS.CAIXINHA.LANCAMENTO.BUSCAR=\
SELECT l.id_lancamento AS id, l.cd_requisicao::text AS cdRequisicao, l.dt_lancamento AS dtLancamento, \
l.id_responsavel AS idResponsavel, r.nm_responsavel AS nmResponsavel, l.tx_insumo AS txInsumo, l.vl_valor AS vlValor, \
l.in_lancado AS inLancado, l.in_pago AS inPago, l.nr_versao AS nrVersao, l.dh_alteracao AS dhAlteracao, \
(SELECT COUNT(*) FROM caixinha_comprovante c WHERE c.id_lancamento = l.id_lancamento) AS qtComprovantes \
FROM caixinha_lancamento l JOIN caixinha_responsavel r ON r.id_responsavel = l.id_responsavel \
WHERE l.id_lancamento = :id

SPS.CAIXINHA.LANCAMENTO.BUSCAR_REQUISICAO=\
SELECT id_lancamento FROM caixinha_lancamento WHERE cd_requisicao = CAST(:cdRequisicao AS uuid)

## Devolve 0 linhas quando o cd_requisicao já existe (reenvio): o serviço devolve o lançamento original.
SPI.CAIXINHA.LANCAMENTO.INSERIR=\
INSERT INTO caixinha_lancamento (cd_requisicao, dt_lancamento, id_responsavel, tx_insumo, vl_valor, in_lancado, in_pago) \
VALUES (CAST(:cdRequisicao AS uuid), :dtLancamento, :idResponsavel, :txInsumo, :vlValor, :inLancado, :inPago) \
ON CONFLICT (cd_requisicao) DO NOTHING RETURNING id_lancamento

## Só altera se a versão ainda for a que o cliente viu; devolve o nº de linhas (0 = conflito ou inexistente).
SPU.CAIXINHA.LANCAMENTO.ALTERAR=\
UPDATE caixinha_lancamento SET dt_lancamento = :dtLancamento, id_responsavel = :idResponsavel, tx_insumo = :txInsumo, \
vl_valor = :vlValor, in_lancado = :inLancado, in_pago = :inPago, nr_versao = nr_versao + 1, dh_alteracao = now() \
WHERE id_lancamento = :id AND nr_versao = :nrVersao

SPU.CAIXINHA.LANCAMENTO.MARCAR=\
UPDATE caixinha_lancamento SET in_lancado = :inLancado, in_pago = :inPago, nr_versao = nr_versao + 1, dh_alteracao = now() \
WHERE id_lancamento = :id AND nr_versao = :nrVersao

SPD.CAIXINHA.LANCAMENTO.DELETAR=\
DELETE FROM caixinha_lancamento WHERE id_lancamento = :id AND nr_versao = :nrVersao

## Resumo: a cláusula WHERE dos filtros é acrescentada pelo repositório.
SPS.CAIXINHA.LANCAMENTO.RESUMO=\
SELECT COALESCE(SUM(l.vl_valor), 0) AS total, \
COALESCE(SUM(CASE WHEN l.in_pago THEN l.vl_valor ELSE 0 END), 0) AS pago, \
COUNT(*) AS qtLancamentos, \
COUNT(*) FILTER (WHERE l.in_pago) AS qtPagos \
FROM caixinha_lancamento l JOIN caixinha_responsavel r ON r.id_responsavel = l.id_responsavel WHERE 1 = 1

## ---------- comprovantes ----------
SPS.CAIXINHA.COMPROVANTE.LISTAR=\
SELECT c.id_comprovante AS id, c.id_lancamento AS idLancamento, c.id_arquivo AS idArquivo, arq.nm_arquivo AS nmArquivo, \
arq.nm_content_type AS nmContentType, arq.nr_tamanho_bytes AS nrTamanhoBytes, c.dh_criacao AS dhCriacao \
FROM caixinha_comprovante c JOIN arquivo_armazenado arq ON arq.id_arquivo = c.id_arquivo \
WHERE c.id_lancamento = :idLancamento ORDER BY c.id_comprovante

SPS.CAIXINHA.COMPROVANTE.BUSCAR=\
SELECT c.id_comprovante AS id, c.id_lancamento AS idLancamento, c.id_arquivo AS idArquivo, arq.nm_arquivo AS nmArquivo, \
arq.nm_content_type AS nmContentType, arq.nr_tamanho_bytes AS nrTamanhoBytes, c.dh_criacao AS dhCriacao \
FROM caixinha_comprovante c JOIN arquivo_armazenado arq ON arq.id_arquivo = c.id_arquivo \
WHERE c.id_comprovante = :id

SPS.CAIXINHA.COMPROVANTE.BUSCAR_REQUISICAO=\
SELECT id_comprovante FROM caixinha_comprovante WHERE cd_requisicao = CAST(:cdRequisicao AS uuid)

SPI.CAIXINHA.COMPROVANTE.INSERIR=\
INSERT INTO caixinha_comprovante (id_lancamento, id_arquivo, cd_requisicao) \
VALUES (:idLancamento, :idArquivo, CAST(:cdRequisicao AS uuid))

SPD.CAIXINHA.COMPROVANTE.DELETAR=\
DELETE FROM caixinha_comprovante WHERE id_comprovante = :id
