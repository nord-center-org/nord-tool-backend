## ---------- configuração ----------
SPS.FINANCEIRO.CONFIGURACAO.BUSCAR=\
SELECT id_configuracao AS id, vl_meta_saldo AS vlMetaSaldo, nr_meses_media AS nrMesesMedia, \
nr_dia_conferencia AS nrDiaConferencia, nr_dia_fechamento_fatura AS nrDiaFechamentoFatura \
FROM financeiro_configuracao WHERE cd_configuracao = 'PADRAO'

SPI.FINANCEIRO.CONFIGURACAO.GARANTIR=\
INSERT INTO financeiro_configuracao (cd_configuracao) VALUES ('PADRAO') ON CONFLICT (cd_configuracao) DO NOTHING

SPU.FINANCEIRO.CONFIGURACAO.ALTERAR=\
UPDATE financeiro_configuracao SET vl_meta_saldo = :vlMetaSaldo, nr_meses_media = :nrMesesMedia, \
nr_dia_conferencia = :nrDiaConferencia, nr_dia_fechamento_fatura = :nrDiaFechamentoFatura, dh_alteracao = now() \
WHERE cd_configuracao = 'PADRAO'

## ---------- meses ----------
SPS.FINANCEIRO.MES.BUSCAR=\
SELECT id_mes AS id, dt_competencia AS dtCompetencia, vl_saldo_inicial AS vlSaldoInicial, vl_saldo_final AS vlSaldoFinal, \
in_fechado AS inFechado, dh_fechamento AS dhFechamento, nr_versao AS nrVersao \
FROM financeiro_mes WHERE dt_competencia = :competencia

SPS.FINANCEIRO.MES.LISTAR=\
SELECT id_mes AS id, dt_competencia AS dtCompetencia, vl_saldo_inicial AS vlSaldoInicial, vl_saldo_final AS vlSaldoFinal, \
in_fechado AS inFechado, dh_fechamento AS dhFechamento, nr_versao AS nrVersao \
FROM financeiro_mes WHERE dt_competencia BETWEEN :de AND :ate ORDER BY dt_competencia

SPI.FINANCEIRO.MES.GARANTIR=\
INSERT INTO financeiro_mes (dt_competencia) VALUES (:competencia) ON CONFLICT (dt_competencia) DO NOTHING

## Só altera mês aberto; devolve o nº de linhas (0 = já fechado).
SPU.FINANCEIRO.MES.SALDO_INICIAL=\
UPDATE financeiro_mes SET vl_saldo_inicial = :vlSaldoInicial, nr_versao = nr_versao + 1, dh_alteracao = now() \
WHERE dt_competencia = :competencia AND in_fechado = FALSE

## Só fecha mês aberto; devolve o nº de linhas (0 = já fechado).
SPU.FINANCEIRO.MES.FECHAR=\
UPDATE financeiro_mes SET in_fechado = TRUE, vl_saldo_final = :vlSaldoFinal, dh_fechamento = now(), \
id_usuario_fechamento = :idUsuario, nr_versao = nr_versao + 1, dh_alteracao = now() \
WHERE dt_competencia = :competencia AND in_fechado = FALSE

SPU.FINANCEIRO.MES.REABRIR=\
UPDATE financeiro_mes SET in_fechado = FALSE, vl_saldo_final = NULL, dh_fechamento = NULL, id_usuario_fechamento = NULL, \
nr_versao = nr_versao + 1, dh_alteracao = now() WHERE dt_competencia = :competencia AND in_fechado = TRUE

SPS.FINANCEIRO.MES.EXISTE_FECHADO_APOS=\
SELECT COUNT(*) FROM financeiro_mes WHERE in_fechado = TRUE AND dt_competencia > :competencia

SPS.FINANCEIRO.MES.PRIMEIRA_COMPETENCIA=\
SELECT MIN(dt) FROM (SELECT MIN(dt_competencia) AS dt FROM financeiro_lancamento \
UNION ALL SELECT MIN(dt_competencia) FROM financeiro_mes) x

SPS.FINANCEIRO.MES.CONTAR_PREVISTOS=\
SELECT COUNT(*) FROM financeiro_lancamento WHERE dt_competencia = :competencia AND in_realizado = FALSE

## ---------- somas por mês e categoria ----------
## O filtro opcional de pessoa é acrescentado pelo repositório.
SPS.FINANCEIRO.SOMA.POR_CATEGORIA=\
SELECT l.dt_competencia AS dtCompetencia, l.id_categoria AS idCategoria, SUM(l.vl_lancamento) AS vlTotal, \
COUNT(*) AS qtLancamentos \
FROM financeiro_lancamento l WHERE l.dt_competencia BETWEEN :de AND :ate

## ---------- faturas ----------
SPS.FINANCEIRO.FATURA.DO_MES=\
SELECT l.id_lancamento AS idLancamento, l.id_categoria AS idCategoria, l.vl_lancamento AS vlLancamento, \
lt.dt_leitura AS dtLeitura \
FROM financeiro_lancamento l \
JOIN financeiro_categoria c ON c.id_categoria = l.id_categoria AND c.cd_projecao = 'RITMO_FATURA' \
LEFT JOIN LATERAL (SELECT x.dt_leitura FROM financeiro_fatura_leitura x WHERE x.id_lancamento = l.id_lancamento \
ORDER BY x.dt_leitura DESC LIMIT 1) lt ON TRUE \
WHERE l.dt_competencia = :competencia

## Uma leitura por dia: a última do dia vale.
SPI.FINANCEIRO.FATURA.LEITURA=\
INSERT INTO financeiro_fatura_leitura (id_lancamento, dt_leitura, vl_leitura, id_usuario) \
VALUES (:idLancamento, :dtLeitura, :vlLeitura, :idUsuario) \
ON CONFLICT (id_lancamento, dt_leitura) DO UPDATE SET vl_leitura = EXCLUDED.vl_leitura, id_usuario = EXCLUDED.id_usuario

SPS.FINANCEIRO.FATURA.LEITURAS=\
SELECT id_leitura AS id, id_lancamento AS idLancamento, dt_leitura AS dtLeitura, vl_leitura AS vlLeitura \
FROM financeiro_fatura_leitura WHERE id_lancamento = :idLancamento ORDER BY dt_leitura

## ---------- recorrências ----------
SPS.FINANCEIRO.RECORRENCIA.LISTAR=\
SELECT r.id_recorrencia AS id, r.id_categoria AS idCategoria, c.nm_categoria AS nmCategoria, c.cd_tipo AS cdTipo, \
r.id_pessoa AS idPessoa, p.nm_pessoa AS nmPessoa, r.ds_recorrencia AS dsRecorrencia, r.vl_recorrencia AS vlRecorrencia, \
r.nr_dia AS nrDia, r.dt_inicio AS dtInicio, r.dt_fim AS dtFim, r.in_ativo AS inAtivo, r.nr_versao AS nrVersao \
FROM financeiro_recorrencia r \
JOIN financeiro_categoria c ON c.id_categoria = r.id_categoria \
JOIN financeiro_pessoa p ON p.id_pessoa = r.id_pessoa

SPI.FINANCEIRO.RECORRENCIA.INSERIR=\
INSERT INTO financeiro_recorrencia (id_categoria, id_pessoa, ds_recorrencia, vl_recorrencia, nr_dia, dt_inicio, dt_fim, in_ativo) \
VALUES (:idCategoria, :idPessoa, :dsRecorrencia, :vlRecorrencia, :nrDia, :dtInicio, :dtFim, :inAtivo)

## Só altera se a versão ainda for a que o cliente viu; devolve o nº de linhas (0 = conflito ou inexistente).
SPU.FINANCEIRO.RECORRENCIA.ALTERAR=\
UPDATE financeiro_recorrencia SET id_categoria = :idCategoria, id_pessoa = :idPessoa, ds_recorrencia = :dsRecorrencia, \
vl_recorrencia = :vlRecorrencia, nr_dia = :nrDia, dt_inicio = :dtInicio, dt_fim = :dtFim, in_ativo = :inAtivo, \
nr_versao = nr_versao + 1, dh_alteracao = now() WHERE id_recorrencia = :id AND nr_versao = :nrVersao
