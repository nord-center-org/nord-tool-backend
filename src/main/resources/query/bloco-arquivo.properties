## Bloco de notas v3: planilhas e documentos avulsos. Tudo filtra pelo dono.

SPS.BLOCO.ARQUIVOS=\
SELECT id_arquivo_bloco AS id, cd_tipo AS cdTipo, nm_titulo AS nmTitulo, cd_cor AS cdCor, nr_versao AS nrVersao, \
dh_criacao AS dhCriacao, dh_alteracao AS dhAlteracao \
FROM bloco_arquivo WHERE id_usuario = :idUsuario ORDER BY dh_alteracao DESC, id_arquivo_bloco DESC

SPS.BLOCO.ARQUIVOS.CONTAR=\
SELECT COUNT(*) FROM bloco_arquivo WHERE id_usuario = :idUsuario

SPS.BLOCO.ARQUIVO=\
SELECT id_arquivo_bloco AS id, cd_tipo AS cdTipo, nm_titulo AS nmTitulo, cd_cor AS cdCor, nr_versao AS nrVersao, \
dh_criacao AS dhCriacao, dh_alteracao AS dhAlteracao, tx_conteudo AS conteudo \
FROM bloco_arquivo WHERE id_arquivo_bloco = :id AND id_usuario = :idUsuario

SPI.BLOCO.ARQUIVO=\
INSERT INTO bloco_arquivo (id_usuario, cd_tipo, nm_titulo, cd_cor, tx_conteudo) VALUES (:idUsuario, :tipo, :titulo, :cor, :conteudo) \
RETURNING id_arquivo_bloco

SPU.BLOCO.ARQUIVO=\
UPDATE bloco_arquivo SET nm_titulo = :titulo, cd_cor = :cor, tx_conteudo = COALESCE(CAST(:conteudo AS TEXT), tx_conteudo), \
nr_versao = nr_versao + 1, dh_alteracao = NOW() \
WHERE id_arquivo_bloco = :id AND id_usuario = :idUsuario AND nr_versao = :nrVersao

SPD.BLOCO.ARQUIVO=\
DELETE FROM bloco_arquivo WHERE id_arquivo_bloco = :id AND id_usuario = :idUsuario
