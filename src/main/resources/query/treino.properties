## Treinos (Gestão Individual): tudo filtrado pelo dono (:idDono = usuário logado).

SPS.TREINO.LISTAR=\
SELECT t.id_treino AS id, t.nm_treino AS nmTreino, t.tx_observacao AS txObservacao, t.tx_dias AS txDias, t.nr_ordem AS nrOrdem, \
t.in_ativo AS inAtivo, t.nr_versao AS nrVersao, \
(SELECT MAX(s.dt_sessao) FROM treino_sessao s WHERE s.id_treino = t.id_treino) AS dtUltimaSessao, \
(SELECT COUNT(*) FROM treino_sessao s WHERE s.id_treino = t.id_treino) AS qtSessoes \
FROM treino t WHERE t.id_usuario_dono = :idDono AND (CAST(:id AS bigint) IS NULL OR t.id_treino = :id) \
ORDER BY t.nr_ordem, LOWER(t.nm_treino), t.id_treino

SPS.TREINO.EXERCICIOS=\
SELECT e.id_exercicio AS id, e.id_treino AS idTreino, e.nr_ordem AS nrOrdem, e.nm_exercicio AS nmExercicio, e.nr_series AS nrSeries, \
e.tx_repeticoes AS txRepeticoes, e.vl_carga AS vlCarga, e.nr_descanso_seg AS nrDescansoSeg, e.tx_observacao AS txObservacao \
FROM treino_exercicio e JOIN treino t ON t.id_treino = e.id_treino \
WHERE t.id_usuario_dono = :idDono ORDER BY e.id_treino, e.nr_ordem, e.id_exercicio

SPI.TREINO.INSERIR=\
INSERT INTO treino (id_usuario_dono, nm_treino, tx_observacao, tx_dias, nr_ordem, in_ativo) \
VALUES (:idDono, :nmTreino, :txObservacao, :txDias, :nrOrdem, :inAtivo) RETURNING id_treino

SPU.TREINO.ALTERAR=\
UPDATE treino SET nm_treino = :nmTreino, tx_observacao = :txObservacao, tx_dias = :txDias, nr_ordem = :nrOrdem, in_ativo = :inAtivo, \
nr_versao = nr_versao + 1, dh_alteracao = now() \
WHERE id_treino = :id AND id_usuario_dono = :idDono AND nr_versao = :nrVersao

SPD.TREINO.DELETAR=\
DELETE FROM treino WHERE id_treino = :id AND id_usuario_dono = :idDono AND nr_versao = :nrVersao

SPI.TREINO.EXERCICIO.INSERIR=\
INSERT INTO treino_exercicio (id_treino, nr_ordem, nm_exercicio, nr_series, tx_repeticoes, vl_carga, nr_descanso_seg, tx_observacao) \
VALUES (:idTreino, :nrOrdem, :nmExercicio, :nrSeries, :txRepeticoes, :vlCarga, :nrDescansoSeg, :txObservacao)

SPU.TREINO.EXERCICIO.ALTERAR=\
UPDATE treino_exercicio SET nr_ordem = :nrOrdem, nm_exercicio = :nmExercicio, nr_series = :nrSeries, tx_repeticoes = :txRepeticoes, \
vl_carga = :vlCarga, nr_descanso_seg = :nrDescansoSeg, tx_observacao = :txObservacao \
WHERE id_exercicio = :id AND id_treino = :idTreino

SPD.TREINO.EXERCICIO.DELETAR=\
DELETE FROM treino_exercicio WHERE id_exercicio = :id AND id_treino = :idTreino

## Progressão: a carga usada na sessão vira a carga atual do exercício (só exercícios do dono).
SPU.TREINO.EXERCICIO.CARGA=\
UPDATE treino_exercicio SET vl_carga = :vlCarga \
WHERE id_exercicio = :id AND id_treino IN (SELECT id_treino FROM treino WHERE id_usuario_dono = :idDono)

SPS.TREINO.SESSOES=\
SELECT s.id_sessao AS id, s.id_treino AS idTreino, s.nm_treino AS nmTreino, s.dt_sessao AS dtSessao, s.nr_duracao_min AS nrDuracaoMin, \
s.tx_observacao AS txObservacao \
FROM treino_sessao s WHERE s.id_usuario_dono = :idDono ORDER BY s.dt_sessao DESC, s.id_sessao DESC LIMIT :limite

SPS.TREINO.SESSAO.EXERCICIOS=\
SELECT se.id_sessao AS idSessao, se.nr_ordem AS nrOrdem, se.id_exercicio AS idExercicio, se.nm_exercicio AS nmExercicio, \
se.tx_repeticoes AS txRepeticoes, se.vl_carga AS vlCarga, se.in_feito AS inFeito \
FROM treino_sessao_exercicio se JOIN treino_sessao s ON s.id_sessao = se.id_sessao \
WHERE s.id_usuario_dono = :idDono AND se.id_sessao IN (:ids) ORDER BY se.id_sessao, se.nr_ordem

SPI.TREINO.SESSAO.INSERIR=\
INSERT INTO treino_sessao (id_treino, id_usuario_dono, nm_treino, dt_sessao, nr_duracao_min, tx_observacao) \
VALUES (:idTreino, :idDono, :nmTreino, :dtSessao, :nrDuracaoMin, :txObservacao) RETURNING id_sessao

SPI.TREINO.SESSAO.EXERCICIO.INSERIR=\
INSERT INTO treino_sessao_exercicio (id_sessao, nr_ordem, id_exercicio, nm_exercicio, tx_repeticoes, vl_carga, in_feito) \
VALUES (:idSessao, :nrOrdem, :idExercicio, :nmExercicio, :txRepeticoes, :vlCarga, :inFeito)

SPD.TREINO.SESSAO.DELETAR=\
DELETE FROM treino_sessao WHERE id_sessao = :id AND id_usuario_dono = :idDono
