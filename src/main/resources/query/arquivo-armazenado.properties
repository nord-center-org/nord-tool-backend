SPI.ARQUIVO_ARMAZENADO.INSERIR=\
INSERT INTO arquivo_armazenado (nm_provedor, cd_referencia, nm_arquivo, nm_content_type, nr_tamanho_bytes, nm_hash_sha256, bin_conteudo) \
VALUES (:nmProvedor, :cdReferencia, :nmArquivo, :nmContentType, :nrTamanhoBytes, :nmHashSha256, :binConteudo)

# Única consulta que lê bin_conteudo. Nunca selecionar os bytes em listagens.
SPS.ARQUIVO_ARMAZENADO.BUSCAR_COM_CONTEUDO=\
SELECT id_arquivo AS id, nm_provedor AS nmProvedor, cd_referencia AS cdReferencia, nm_arquivo AS nmArquivo, \
nm_content_type AS nmContentType, nr_tamanho_bytes AS nrTamanhoBytes, nm_hash_sha256 AS nmHashSha256, \
bin_conteudo AS binConteudo, dh_criacao AS dhCriacao \
FROM arquivo_armazenado WHERE id_arquivo = :id

SPS.ARQUIVO_ARMAZENADO.BUSCAR_METADADOS=\
SELECT id_arquivo AS id, nm_provedor AS nmProvedor, cd_referencia AS cdReferencia, nm_arquivo AS nmArquivo, \
nm_content_type AS nmContentType, nr_tamanho_bytes AS nrTamanhoBytes, nm_hash_sha256 AS nmHashSha256, \
dh_criacao AS dhCriacao \
FROM arquivo_armazenado WHERE id_arquivo = :id

SPD.ARQUIVO_ARMAZENADO.DELETAR=\
DELETE FROM arquivo_armazenado WHERE id_arquivo = :id
