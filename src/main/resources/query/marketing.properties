# Marketing: contas de redes conectadas (tokens cifrados pelo backend) e publicações.

SPS.MARKETING.CONTAS=\
SELECT id_conta AS id, id_usuario AS idUsuario, cd_rede AS cdRede, tx_id_externo AS txIdExterno, tx_nome AS txNome, tx_foto AS txFoto, \
tx_token_acesso AS txTokenAcesso, tx_token_renovacao AS txTokenRenovacao, dh_expira_acesso AS dhExpiraAcesso, dh_criacao AS dhCriacao \
FROM marketing_conta WHERE id_usuario = :idUsuario ORDER BY cd_rede, dh_criacao

SPS.MARKETING.CONTA=\
SELECT id_conta AS id, id_usuario AS idUsuario, cd_rede AS cdRede, tx_id_externo AS txIdExterno, tx_nome AS txNome, tx_foto AS txFoto, \
tx_token_acesso AS txTokenAcesso, tx_token_renovacao AS txTokenRenovacao, dh_expira_acesso AS dhExpiraAcesso, dh_criacao AS dhCriacao \
FROM marketing_conta WHERE id_usuario = :idUsuario AND id_conta = :idConta

## Conectar de novo a mesma conta só troca os tokens, o nome e a foto.
SPI.MARKETING.CONTA=\
INSERT INTO marketing_conta (id_usuario, cd_rede, tx_id_externo, tx_nome, tx_foto, tx_token_acesso, tx_token_renovacao, dh_expira_acesso) \
VALUES (:idUsuario, :rede, :idExterno, :nome, :foto, :acesso, :renovacao, :expira) \
ON CONFLICT (id_usuario, cd_rede, tx_id_externo) DO UPDATE SET tx_nome = EXCLUDED.tx_nome, tx_foto = EXCLUDED.tx_foto, \
tx_token_acesso = EXCLUDED.tx_token_acesso, tx_token_renovacao = COALESCE(EXCLUDED.tx_token_renovacao, marketing_conta.tx_token_renovacao), \
dh_expira_acesso = EXCLUDED.dh_expira_acesso, dh_atualizacao = NOW() \
RETURNING id_conta

SPU.MARKETING.TOKENS=\
UPDATE marketing_conta SET tx_token_acesso = :acesso, tx_token_renovacao = :renovacao, dh_expira_acesso = :expira, dh_atualizacao = NOW() \
WHERE id_conta = :idConta

SPD.MARKETING.CONTA=\
DELETE FROM marketing_conta WHERE id_usuario = :idUsuario AND id_conta = :idConta

SPI.MARKETING.PUBLICACAO=\
INSERT INTO marketing_publicacao (id_usuario, id_conta, tx_titulo, tx_legenda, in_publico) \
VALUES (:idUsuario, :idConta, :titulo, :legenda, :publico) RETURNING id_publicacao

SPU.MARKETING.PUBLICACAO=\
UPDATE marketing_publicacao SET cd_status = :status, tx_id_externo = :idExterno, tx_link = :link, tx_aviso = :aviso, dh_atualizacao = NOW() \
WHERE id_publicacao = :id

## Envio que ficou preso (servidor reiniciou no meio): vira erro depois de 1 hora.
SPU.MARKETING.PRESAS=\
UPDATE marketing_publicacao SET cd_status = 'ERRO', tx_aviso = 'O envio foi interrompido (o servidor reiniciou). Publique de novo.', \
dh_atualizacao = NOW() WHERE id_usuario = :idUsuario AND cd_status = 'ENVIANDO' AND dh_atualizacao < NOW() - INTERVAL '1 hour'

SPS.MARKETING.PUBLICACOES=\
SELECT p.id_publicacao AS id, p.id_conta AS idConta, c.cd_rede AS cdRede, c.tx_nome AS txConta, p.tx_titulo AS txTitulo, \
p.in_publico AS inPublico, p.cd_status AS cdStatus, p.tx_link AS txLink, p.tx_aviso AS txAviso, p.dh_criacao AS dhCriacao, \
p.dh_atualizacao AS dhAtualizacao \
FROM marketing_publicacao p JOIN marketing_conta c ON c.id_conta = p.id_conta \
WHERE p.id_usuario = :idUsuario ORDER BY p.dh_criacao DESC, p.id_publicacao DESC LIMIT :limite
