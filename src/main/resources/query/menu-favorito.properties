## Favoritos do menu lateral: lista JSON de caminhos, uma linha por pessoa.

SPS.MENU.FAVORITOS=\
SELECT tx_caminhos FROM usuario_menu_favorito WHERE id_usuario = :idUsuario

SPU.MENU.FAVORITOS=\
INSERT INTO usuario_menu_favorito (id_usuario, tx_caminhos) VALUES (:idUsuario, :caminhos) \
ON CONFLICT (id_usuario) DO UPDATE SET tx_caminhos = EXCLUDED.tx_caminhos, dh_alteracao = NOW()
