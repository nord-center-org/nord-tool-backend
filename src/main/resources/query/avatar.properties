## Avatares (criador de avatar e home animada).

SPS.AVATAR.BUSCAR=\
SELECT u.id_usuario AS idUsuario, u.nm_nome AS nmNome, c.nm_cargo AS nmCargo, a.ds_config AS dsConfig, a.dh_alteracao AS dhAlteracao, \
TRUE AS flProprio \
FROM usuario u LEFT JOIN cargos c ON c.id_cargo = u.id_cargo LEFT JOIN usuario_avatar a ON a.id_usuario = u.id_usuario \
WHERE u.id_usuario = :idUsuario

SPI.AVATAR.SALVAR=\
INSERT INTO usuario_avatar (id_usuario, ds_config, dh_alteracao) VALUES (:idUsuario, :dsConfig, now()) \
ON CONFLICT (id_usuario) DO UPDATE SET ds_config = EXCLUDED.ds_config, dh_alteracao = now()

## Eu, meu superior, colegas do mesmo superior e toda a equipe abaixo de mim. Eu primeiro, depois por nome.
SPS.AVATAR.EQUIPE=\
WITH RECURSIVE abaixo AS ( \
    SELECT id_usuario FROM usuario WHERE id_superior = :idUsuario \
    UNION \
    SELECT u.id_usuario FROM usuario u JOIN abaixo e ON u.id_superior = e.id_usuario \
), eu AS (SELECT id_usuario, id_superior FROM usuario WHERE id_usuario = :idUsuario) \
SELECT u.id_usuario AS idUsuario, u.nm_nome AS nmNome, c.nm_cargo AS nmCargo, a.ds_config AS dsConfig, a.dh_alteracao AS dhAlteracao, \
(u.id_usuario = :idUsuario) AS flProprio \
FROM usuario u LEFT JOIN cargos c ON c.id_cargo = u.id_cargo LEFT JOIN usuario_avatar a ON a.id_usuario = u.id_usuario \
WHERE u.in_ativo = TRUE AND u.cd_situacao_cadastro = 'APROVADO' AND ( \
    u.id_usuario = :idUsuario \
    OR u.id_usuario = (SELECT id_superior FROM eu) \
    OR (u.id_superior IS NOT NULL AND u.id_superior = (SELECT id_superior FROM eu)) \
    OR u.id_usuario IN (SELECT id_usuario FROM abaixo)) \
ORDER BY (u.id_usuario = :idUsuario) DESC, LOWER(u.nm_nome) \
LIMIT :limite
