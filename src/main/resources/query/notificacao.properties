# Notificações no celular (Web Push): chaves VAPID, aparelhos, preferências e avisos já enviados.

SPS.PUSH.CHAVES=\
SELECT tx_publica, tx_privada FROM push_chave WHERE id_chave = 1

SPI.PUSH.CHAVES=\
INSERT INTO push_chave (id_chave, tx_publica, tx_privada) VALUES (1, :publica, :privada) ON CONFLICT (id_chave) DO NOTHING

## O mesmo aparelho (endpoint) passa para quem ativou por último.
SPI.PUSH.INSCREVER=\
INSERT INTO push_inscricao (id_usuario, tx_endpoint, tx_p256dh, tx_auth, nm_aparelho) VALUES (:idUsuario, :endpoint, :p256dh, :auth, :aparelho) \
ON CONFLICT (tx_endpoint) DO UPDATE SET id_usuario = EXCLUDED.id_usuario, tx_p256dh = EXCLUDED.tx_p256dh, tx_auth = EXCLUDED.tx_auth, \
nm_aparelho = EXCLUDED.nm_aparelho, dh_criacao = NOW()

SPD.PUSH.CANCELAR=\
DELETE FROM push_inscricao WHERE id_usuario = :idUsuario AND tx_endpoint = :endpoint

SPD.PUSH.ENDPOINT=\
DELETE FROM push_inscricao WHERE tx_endpoint = :endpoint

SPS.PUSH.INSCRICOES=\
SELECT id_inscricao AS id, id_usuario AS idUsuario, tx_endpoint AS txEndpoint, tx_p256dh AS txP256dh, tx_auth AS txAuth, \
nm_aparelho AS nmAparelho, dh_criacao AS dhCriacao, dh_ultimo_envio AS dhUltimoEnvio \
FROM push_inscricao WHERE id_usuario IN (:ids) ORDER BY dh_criacao DESC

SPU.PUSH.ENVIO=\
UPDATE push_inscricao SET dh_ultimo_envio = NOW() WHERE id_inscricao = :id

## Quem não tem linha usa o padrão (tudo ligado, 30 min antes).
SPS.NOTIFICACAO.PREFERENCIAS=\
SELECT u.id_usuario AS idUsuario, COALESCE(p.in_demanda_nova, TRUE) AS inDemandaNova, COALESCE(p.in_demanda_alterada, TRUE) AS inDemandaAlterada, \
COALESCE(p.in_horario, TRUE) AS inHorario, COALESCE(p.nr_antecedencia_min, 30) AS nrAntecedenciaMin, COALESCE(p.in_prazo, TRUE) AS inPrazo, \
COALESCE(p.in_sac, TRUE) AS inSac, COALESCE(p.in_minhas_acoes, TRUE) AS inMinhasAcoes \
FROM usuario u LEFT JOIN notificacao_preferencia p ON p.id_usuario = u.id_usuario WHERE u.id_usuario IN (:ids)

SPI.NOTIFICACAO.PREFERENCIA=\
INSERT INTO notificacao_preferencia (id_usuario, in_demanda_nova, in_demanda_alterada, in_horario, nr_antecedencia_min, in_prazo, in_sac, in_minhas_acoes) \
VALUES (:idUsuario, :nova, :alterada, :horario, :antecedencia, :prazo, :sac, :minhas) \
ON CONFLICT (id_usuario) DO UPDATE SET in_demanda_nova = EXCLUDED.in_demanda_nova, in_demanda_alterada = EXCLUDED.in_demanda_alterada, \
in_horario = EXCLUDED.in_horario, nr_antecedencia_min = EXCLUDED.nr_antecedencia_min, in_prazo = EXCLUDED.in_prazo, in_sac = EXCLUDED.in_sac, \
in_minhas_acoes = EXCLUDED.in_minhas_acoes, dh_atualizacao = NOW()

SPI.NOTIFICACAO.ENVIADA=\
INSERT INTO notificacao_enviada (id_usuario, cd_chave) VALUES (:idUsuario, :chave) ON CONFLICT DO NOTHING

SPD.NOTIFICACAO.ENVIADAS=\
DELETE FROM notificacao_enviada WHERE dh_envio < :antes

## Dono e com quem a demanda foi compartilhada.
SPS.NOTIFICACAO.DEMANDA=\
SELECT cs.id_cronograma_semanal AS id, cs.nm_cronograma_semanal AS nmCronogramaSemanal, cs.id_usuario_dono AS idDono, \
cs.nm_status_cronograma AS nmStatusCronograma, cs.dt_agendamento AS dtAgendamento, cs.dt_prazo AS dtPrazo, \
concat_ws(',', cs.id_usuario_dono::text, (SELECT string_agg(cc.id_usuario::text, ',') FROM cronograma_compartilhamento cc WHERE cc.id_cronograma_semanal = cs.id_cronograma_semanal)) AS txEnvolvidos \
FROM cronograma_semanal cs WHERE cs.id_cronograma_semanal = :id

SPS.NOTIFICACAO.AGENDADAS=\
SELECT cs.id_cronograma_semanal AS id, cs.nm_cronograma_semanal AS nmCronogramaSemanal, cs.id_usuario_dono AS idDono, \
cs.nm_status_cronograma AS nmStatusCronograma, cs.dt_agendamento AS dtAgendamento, cs.dt_prazo AS dtPrazo, \
concat_ws(',', cs.id_usuario_dono::text, (SELECT string_agg(cc.id_usuario::text, ',') FROM cronograma_compartilhamento cc WHERE cc.id_cronograma_semanal = cs.id_cronograma_semanal)) AS txEnvolvidos \
FROM cronograma_semanal cs \
WHERE cs.dt_agendamento >= :de AND cs.dt_agendamento <= :ate AND COALESCE(cs.nm_status_cronograma, '') <> 'finalizada' \
AND COALESCE(cs.in_cronograma_fixo, FALSE) = FALSE

SPS.NOTIFICACAO.PRAZOS=\
SELECT cs.id_cronograma_semanal AS id, cs.nm_cronograma_semanal AS nmCronogramaSemanal, cs.id_usuario_dono AS idDono, \
cs.nm_status_cronograma AS nmStatusCronograma, cs.dt_agendamento AS dtAgendamento, cs.dt_prazo AS dtPrazo, \
concat_ws(',', cs.id_usuario_dono::text, (SELECT string_agg(cc.id_usuario::text, ',') FROM cronograma_compartilhamento cc WHERE cc.id_cronograma_semanal = cs.id_cronograma_semanal)) AS txEnvolvidos \
FROM cronograma_semanal cs \
WHERE cs.dt_prazo >= :inicio AND cs.dt_prazo < :fim AND COALESCE(cs.nm_status_cronograma, '') <> 'finalizada' \
AND COALESCE(cs.in_cronograma_fixo, FALSE) = FALSE

SPS.NOTIFICACAO.NOME=\
SELECT nm_nome FROM usuario WHERE id_usuario = :id
