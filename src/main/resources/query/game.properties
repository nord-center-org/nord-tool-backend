# Games: partidas, recordes, ranking, conquistas, favoritos e Copas.

SPI.GAME.PARTIDA=\
INSERT INTO game_partida (id_usuario, cd_jogo, cd_modo, nr_pontos, in_vitoria, nr_colocacao, nr_jogadores, nr_bots, cd_dificuldade, nr_duracao_s, id_copa) \
VALUES (:idUsuario, :jogo, :modo, :pontos, :vitoria, :colocacao, :jogadores, :bots, :dificuldade, :duracao, :copa)

## Totais da pessoa (num jogo ou em todos): partidas, vitórias, recorde e quantos jogos diferentes.
SPS.GAME.TOTAIS=\
SELECT COUNT(*) AS nrPartidas, COALESCE(SUM(CASE WHEN in_vitoria THEN 1 ELSE 0 END), 0) AS nrVitorias, COALESCE(MAX(nr_pontos), 0) AS nrRecorde, \
COUNT(DISTINCT cd_jogo) AS nrJogos, \
COALESCE(SUM(CASE WHEN in_vitoria AND cd_dificuldade = 'dificil' THEN 1 ELSE 0 END), 0) AS nrVitoriasDificil, \
COALESCE(SUM(CASE WHEN in_vitoria AND nr_jogadores = 8 THEN 1 ELSE 0 END), 0) AS nrVitoriasOito \
FROM game_partida WHERE id_usuario = :idUsuario AND (CAST(:jogo AS VARCHAR) IS NULL OR cd_jogo = :jogo)

## Ranking do jogo: mais vitórias, depois o maior recorde.
SPS.GAME.RANKING=\
SELECT p.id_usuario AS idUsuario, u.nm_nome AS nmNome, a.ds_config AS dsAvatar, COUNT(*) AS nrPartidas, \
SUM(CASE WHEN p.in_vitoria THEN 1 ELSE 0 END) AS nrVitorias, MAX(p.nr_pontos) AS nrRecorde \
FROM game_partida p JOIN usuario u ON u.id_usuario = p.id_usuario LEFT JOIN usuario_avatar a ON a.id_usuario = p.id_usuario \
WHERE p.cd_jogo = :jogo AND u.in_ativo = TRUE \
GROUP BY p.id_usuario, u.nm_nome, a.ds_config ORDER BY nrVitorias DESC, nrRecorde DESC, nrPartidas ASC LIMIT :limite

SPS.GAME.HISTORICO=\
SELECT id_partida AS id, cd_jogo AS cdJogo, cd_modo AS cdModo, nr_pontos AS nrPontos, in_vitoria AS inVitoria, nr_colocacao AS nrColocacao, \
nr_jogadores AS nrJogadores, nr_bots AS nrBots, cd_dificuldade AS cdDificuldade, nr_duracao_s AS nrDuracaoS, id_copa AS idCopa, dh_criacao AS dhCriacao \
FROM game_partida WHERE id_usuario = :idUsuario AND (CAST(:jogo AS VARCHAR) IS NULL OR cd_jogo = :jogo) ORDER BY dh_criacao DESC, id_partida DESC LIMIT :limite

SPS.GAME.CONQUISTAS=\
SELECT cd_conquista AS cdConquista, dh_criacao AS dhCriacao FROM game_conquista WHERE id_usuario = :idUsuario ORDER BY dh_criacao

## Devolve 1 só quando a conquista é nova.
SPI.GAME.CONQUISTA=\
INSERT INTO game_conquista (id_usuario, cd_conquista) VALUES (:idUsuario, :conquista) ON CONFLICT DO NOTHING

SPS.GAME.FAVORITOS=\
SELECT tx_jogos FROM game_favorito WHERE id_usuario = :idUsuario

SPI.GAME.FAVORITOS=\
INSERT INTO game_favorito (id_usuario, tx_jogos) VALUES (:idUsuario, :jogos) \
ON CONFLICT (id_usuario) DO UPDATE SET tx_jogos = EXCLUDED.tx_jogos, dh_atualizacao = NOW()

SPI.GAME.COPA=\
INSERT INTO game_copa (id_usuario, nr_rodadas, nr_colocacao, tx_resultado) VALUES (:idUsuario, :rodadas, :colocacao, :resultado) RETURNING id_copa

SPS.GAME.COPAS=\
SELECT id_copa AS id, nr_rodadas AS nrRodadas, nr_colocacao AS nrColocacao, tx_resultado AS txResultado, dh_criacao AS dhCriacao \
FROM game_copa WHERE id_usuario = :idUsuario ORDER BY dh_criacao DESC, id_copa DESC LIMIT :limite
