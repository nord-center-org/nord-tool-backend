SPS.TERMO_REPROVA.LISTAR_POR_APARTAMENTO=\
SELECT t.id_termo_reprova AS id, t.id_apartamento_vistoria AS idApartamentoVistoria, t.nr_termo AS nrTermo, \
t.id_arquivo AS idArquivo, a.nm_arquivo AS nmArquivo, t.nr_paginas AS nrPaginas, t.nm_situacao AS nmSituacao, \
t.tx_observacao AS txObservacao, t.dh_criacao AS dhCriacao, t.dh_alteracao AS dhAlteracao, \
(SELECT COUNT(*) FROM apartamento_termo_foto f WHERE f.id_termo_reprova = t.id_termo_reprova) AS qtFotos \
FROM apartamento_termo_reprova t JOIN arquivo_armazenado a ON a.id_arquivo = t.id_arquivo \
WHERE t.id_apartamento_vistoria = :idApartamento ORDER BY t.nr_termo

SPS.TERMO_REPROVA.BUSCAR_POR_ID=\
SELECT t.id_termo_reprova AS id, t.id_apartamento_vistoria AS idApartamentoVistoria, t.nr_termo AS nrTermo, \
t.id_arquivo AS idArquivo, a.nm_arquivo AS nmArquivo, t.nr_paginas AS nrPaginas, t.nm_situacao AS nmSituacao, \
t.tx_observacao AS txObservacao, t.dh_criacao AS dhCriacao, t.dh_alteracao AS dhAlteracao, \
(SELECT COUNT(*) FROM apartamento_termo_foto f WHERE f.id_termo_reprova = t.id_termo_reprova) AS qtFotos \
FROM apartamento_termo_reprova t JOIN arquivo_armazenado a ON a.id_arquivo = t.id_arquivo \
WHERE t.id_termo_reprova = :id

SPS.TERMO_REPROVA.PROXIMO_NUMERO=\
SELECT COALESCE(MAX(nr_termo), 0) + 1 FROM apartamento_termo_reprova WHERE id_apartamento_vistoria = :idApartamento

SPS.TERMO_REPROVA.APARTAMENTO_EXISTE=\
SELECT COUNT(*) FROM apartamento_vistoria WHERE id_apartamento_vistoria = :id

SPS.TERMO_REPROVA.IDS_POR_APARTAMENTO=\
SELECT id_termo_reprova FROM apartamento_termo_reprova WHERE id_apartamento_vistoria = :idApartamento

SPI.TERMO_REPROVA.INSERIR=\
INSERT INTO apartamento_termo_reprova (id_apartamento_vistoria, nr_termo, id_arquivo, nr_paginas) \
VALUES (:idApartamentoVistoria, :nrTermo, :idArquivo, :nrPaginas)

SPU.TERMO_REPROVA.ATUALIZAR_ARQUIVO=\
UPDATE apartamento_termo_reprova SET id_arquivo = :idArquivo, nr_paginas = :nrPaginas, dh_alteracao = now() \
WHERE id_termo_reprova = :id

SPU.TERMO_REPROVA.ATUALIZAR_SITUACAO=\
UPDATE apartamento_termo_reprova SET nm_situacao = :situacao, tx_observacao = :observacao, dh_alteracao = now() \
WHERE id_termo_reprova = :id

SPD.TERMO_REPROVA.DELETAR=\
DELETE FROM apartamento_termo_reprova WHERE id_termo_reprova = :id

SPS.TERMO_FOTO.LISTAR_POR_TERMO=\
SELECT id_termo_foto AS id, id_termo_reprova AS idTermoReprova, nr_pagina AS nrPagina, nr_ordem AS nrOrdem, \
tx_legenda AS txLegenda, id_arquivo_imagem AS idArquivoImagem, id_arquivo_miniatura AS idArquivoMiniatura, \
dh_criacao AS dhCriacao, dh_alteracao AS dhAlteracao \
FROM apartamento_termo_foto WHERE id_termo_reprova = :idTermo ORDER BY nr_pagina, nr_ordem, id_termo_foto

SPS.TERMO_FOTO.BUSCAR_POR_ID=\
SELECT id_termo_foto AS id, id_termo_reprova AS idTermoReprova, nr_pagina AS nrPagina, nr_ordem AS nrOrdem, \
tx_legenda AS txLegenda, id_arquivo_imagem AS idArquivoImagem, id_arquivo_miniatura AS idArquivoMiniatura, \
dh_criacao AS dhCriacao, dh_alteracao AS dhAlteracao \
FROM apartamento_termo_foto WHERE id_termo_foto = :id

SPS.TERMO_FOTO.PROXIMA_ORDEM=\
SELECT COALESCE(MAX(nr_ordem), -1) + 1 FROM apartamento_termo_foto \
WHERE id_termo_reprova = :idTermo AND nr_pagina = :nrPagina

SPI.TERMO_FOTO.INSERIR=\
INSERT INTO apartamento_termo_foto (id_termo_reprova, nr_pagina, nr_ordem, tx_legenda, id_arquivo_imagem, id_arquivo_miniatura) \
VALUES (:idTermoReprova, :nrPagina, :nrOrdem, :txLegenda, :idArquivoImagem, :idArquivoMiniatura)

SPU.TERMO_FOTO.ATUALIZAR=\
UPDATE apartamento_termo_foto SET nr_pagina = :nrPagina, nr_ordem = :nrOrdem, tx_legenda = :txLegenda, \
id_arquivo_imagem = :idArquivoImagem, id_arquivo_miniatura = :idArquivoMiniatura, dh_alteracao = now() \
WHERE id_termo_foto = :id

SPU.TERMO_FOTO.ATUALIZAR_ORDEM=\
UPDATE apartamento_termo_foto SET nr_ordem = :nrOrdem WHERE id_termo_foto = :id AND id_termo_reprova = :idTermo

SPD.TERMO_FOTO.DELETAR=\
DELETE FROM apartamento_termo_foto WHERE id_termo_foto = :id

SPS.TERMO_FOTO.CONTAR_POR_TERMO=\
SELECT COUNT(*) FROM apartamento_termo_foto WHERE id_termo_reprova = :idTermo
