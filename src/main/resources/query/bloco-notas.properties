## Bloco de notas (Mapeamentos): cadernos pessoais, páginas com o desenho em JSON e imagens. Tudo filtra pelo dono.

SPS.BLOCO.CADERNOS=\
SELECT c.id_caderno AS id, c.nm_titulo AS nmTitulo, c.cd_cor AS cdCor, c.nr_versao AS nrVersao, \
c.dh_criacao AS dhCriacao, c.dh_alteracao AS dhAlteracao, \
(SELECT COUNT(*) FROM bloco_pagina p WHERE p.id_caderno = c.id_caderno) AS qtPaginas, \
(SELECT p.id_pagina FROM bloco_pagina p WHERE p.id_caderno = c.id_caderno ORDER BY p.nr_ordem, p.id_pagina LIMIT 1) AS idCapa \
FROM bloco_caderno c \
WHERE c.id_usuario = :idUsuario AND (CAST(:id AS BIGINT) IS NULL OR c.id_caderno = :id) \
ORDER BY c.dh_alteracao DESC, c.id_caderno DESC

SPS.BLOCO.CADERNOS.CONTAR=\
SELECT COUNT(*) FROM bloco_caderno WHERE id_usuario = :idUsuario

SPI.BLOCO.CADERNO=\
INSERT INTO bloco_caderno (id_usuario, nm_titulo, cd_cor) VALUES (:idUsuario, :titulo, :cor) RETURNING id_caderno

SPU.BLOCO.CADERNO=\
UPDATE bloco_caderno SET nm_titulo = :titulo, cd_cor = :cor, nr_versao = nr_versao + 1, dh_alteracao = NOW() \
WHERE id_caderno = :id AND id_usuario = :idUsuario AND nr_versao = :nrVersao

SPU.BLOCO.CADERNO.TOCAR=\
UPDATE bloco_caderno SET dh_alteracao = NOW() WHERE id_caderno = :id

SPD.BLOCO.CADERNO=\
DELETE FROM bloco_caderno WHERE id_caderno = :id AND id_usuario = :idUsuario

## Arquivos do caderno (fundos de PDF e imagens), para apagar junto com ele.
SPS.BLOCO.CADERNO.ARQUIVOS=\
SELECT id_arquivo_fundo FROM bloco_pagina WHERE id_caderno = :id AND id_arquivo_fundo IS NOT NULL \
UNION ALL SELECT id_arquivo FROM bloco_imagem WHERE id_caderno = :id

SPS.BLOCO.PAGINAS=\
SELECT p.id_pagina AS id, p.id_caderno AS idCaderno, p.nr_ordem AS nrOrdem, p.cd_fundo AS cdFundo, \
p.nr_largura AS nrLargura, p.nr_altura AS nrAltura, (p.id_arquivo_fundo IS NOT NULL) AS inFundo, p.id_arquivo_fundo AS idArquivoFundo, \
p.nr_versao AS nrVersao, p.dh_alteracao AS dhAlteracao \
FROM bloco_pagina p JOIN bloco_caderno c ON c.id_caderno = p.id_caderno \
WHERE c.id_usuario = :idUsuario AND (CAST(:idCaderno AS BIGINT) IS NULL OR p.id_caderno = :idCaderno) \
  AND (CAST(:id AS BIGINT) IS NULL OR p.id_pagina = :id) \
ORDER BY p.nr_ordem, p.id_pagina

SPS.BLOCO.PAGINA.CONTEUDO=\
SELECT p.tx_conteudo FROM bloco_pagina p JOIN bloco_caderno c ON c.id_caderno = p.id_caderno \
WHERE p.id_pagina = :id AND c.id_usuario = :idUsuario

SPI.BLOCO.PAGINA=\
INSERT INTO bloco_pagina (id_caderno, nr_ordem, cd_fundo, nr_largura, nr_altura, id_arquivo_fundo, tx_conteudo) \
VALUES (:idCaderno, :ordem, :fundo, :largura, :altura, :idArquivo, :conteudo) RETURNING id_pagina

## Abre espaço para uma página nova na posição :ordem.
SPU.BLOCO.PAGINAS.EMPURRAR=\
UPDATE bloco_pagina SET nr_ordem = nr_ordem + 1 WHERE id_caderno = :idCaderno AND nr_ordem >= :ordem

SPU.BLOCO.PAGINA.ORDEM=\
UPDATE bloco_pagina SET nr_ordem = :ordem WHERE id_pagina = :id AND id_caderno = :idCaderno

SPU.BLOCO.PAGINA.CONTEUDO=\
UPDATE bloco_pagina SET tx_conteudo = :conteudo, cd_fundo = :fundo, nr_versao = nr_versao + 1, dh_alteracao = NOW() \
WHERE id_pagina = :id AND nr_versao = :nrVersao

SPD.BLOCO.PAGINA=\
DELETE FROM bloco_pagina WHERE id_pagina = :id

SPI.BLOCO.IMAGEM=\
INSERT INTO bloco_imagem (id_caderno, id_arquivo) VALUES (:idCaderno, :idArquivo) RETURNING id_imagem

SPS.BLOCO.IMAGEM.ARQUIVO=\
SELECT i.id_arquivo FROM bloco_imagem i JOIN bloco_caderno c ON c.id_caderno = i.id_caderno \
WHERE i.id_imagem = :id AND c.id_usuario = :idUsuario
