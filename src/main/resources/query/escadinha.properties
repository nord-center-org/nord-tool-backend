## Escadinha 3D. Torres e modelo sempre filtrados pela obra (cabeçalho X-Obra validado no serviço).

SPS.ESCADINHA.TORRES=\
SELECT id_torre AS idTorre, id_obra AS idObra, nm_torre AS nmTorre, nr_ordem AS nrOrdem, \
       CAST(tx_config AS text) AS txConfig, CAST(tx_ciclos AS text) AS txCiclos, \
       (tx_planta IS NOT NULL) AS temPlanta, nr_versao AS nrVersao, dh_atualizacao AS dhAtualizacao \
FROM escadinha_torre WHERE id_obra = :idObra \
  AND (CAST(:idTorre AS bigint) IS NULL OR id_torre = :idTorre) \
ORDER BY nr_ordem, id_torre

SPS.ESCADINHA.TORRES.CONTAR=\
SELECT COUNT(*) FROM escadinha_torre WHERE id_obra = :idObra

SPI.ESCADINHA.TORRE=\
INSERT INTO escadinha_torre (id_obra, nm_torre, nr_ordem, tx_config, tx_ciclos, tx_planta, id_usuario_atualizacao) \
VALUES (:idObra, :nome, :ordem, CAST(:config AS jsonb), CAST(:ciclos AS jsonb), :planta, :idUsuario) RETURNING id_torre

SPU.ESCADINHA.TORRE=\
UPDATE escadinha_torre SET nm_torre = :nome, nr_ordem = :ordem, tx_config = CAST(:config AS jsonb), tx_ciclos = CAST(:ciclos AS jsonb), \
       tx_planta = CASE WHEN :mudarPlanta THEN :planta ELSE tx_planta END, \
       nr_versao = nr_versao + 1, id_usuario_atualizacao = :idUsuario, dh_atualizacao = now() \
WHERE id_obra = :idObra AND id_torre = :idTorre AND nr_versao = :versao

SPD.ESCADINHA.TORRE=\
DELETE FROM escadinha_torre WHERE id_obra = :idObra AND id_torre = :idTorre

SPS.ESCADINHA.TORRE.PLANTA=\
SELECT tx_planta AS planta FROM escadinha_torre WHERE id_obra = :idObra AND id_torre = :idTorre

SPS.ESCADINHA.MODELO=\
SELECT CAST(tx_modelo AS text) AS modelo FROM escadinha_modelo WHERE id_obra = :idObra

SPI.ESCADINHA.MODELO=\
INSERT INTO escadinha_modelo (id_obra, tx_modelo, id_usuario_atualizacao) VALUES (:idObra, CAST(:modelo AS jsonb), :idUsuario) \
ON CONFLICT (id_obra) DO UPDATE SET tx_modelo = EXCLUDED.tx_modelo, id_usuario_atualizacao = EXCLUDED.id_usuario_atualizacao, dh_atualizacao = now()
