## Escadinha 3D. Torres e modelo sempre filtrados pela obra (cabeçalho X-Obra validado no serviço).

SPS.ESCADINHA.TORRES=\
SELECT id_torre AS idTorre, id_obra AS idObra, nm_torre AS nmTorre, nr_ordem AS nrOrdem, \
       CAST(tx_config AS text) AS txConfig, CAST(tx_ciclos AS text) AS txCiclos, CAST(tx_grade AS text) AS txGrade, \
       (tx_planta IS NOT NULL) AS temPlanta, nr_versao AS nrVersao, dh_atualizacao AS dhAtualizacao \
FROM escadinha_torre WHERE id_obra = :idObra \
  AND (CAST(:idTorre AS bigint) IS NULL OR id_torre = :idTorre) \
ORDER BY nr_ordem, id_torre

SPS.ESCADINHA.TORRES.CONTAR=\
SELECT COUNT(*) FROM escadinha_torre WHERE id_obra = :idObra

SPI.ESCADINHA.TORRE=\
INSERT INTO escadinha_torre (id_obra, nm_torre, nr_ordem, tx_config, tx_ciclos, tx_planta, id_usuario_atualizacao) \
VALUES (:idObra, :nome, :ordem, CAST(:config AS jsonb), CAST(:ciclos AS jsonb), :planta, :idUsuario) RETURNING id_torre

SPU.ESCADINHA.TORRE=\
UPDATE escadinha_torre SET nm_torre = :nome, nr_ordem = :ordem, tx_config = CAST(:config AS jsonb), tx_ciclos = CAST(:ciclos AS jsonb), \
       tx_planta = CASE WHEN :mudarPlanta THEN :planta ELSE tx_planta END, \
       nr_versao = nr_versao + 1, id_usuario_atualizacao = :idUsuario, dh_atualizacao = now() \
WHERE id_obra = :idObra AND id_torre = :idTorre AND nr_versao = :versao

SPD.ESCADINHA.TORRE=\
DELETE FROM escadinha_torre WHERE id_obra = :idObra AND id_torre = :idTorre

SPS.ESCADINHA.TORRE.PLANTA=\
SELECT tx_planta AS planta FROM escadinha_torre WHERE id_obra = :idObra AND id_torre = :idTorre

SPS.ESCADINHA.MODELO=\
SELECT CAST(tx_modelo AS text) AS modelo FROM escadinha_modelo WHERE id_obra = :idObra

SPI.ESCADINHA.MODELO=\
INSERT INTO escadinha_modelo (id_obra, tx_modelo, id_usuario_atualizacao) VALUES (:idObra, CAST(:modelo AS jsonb), :idUsuario) \
ON CONFLICT (id_obra) DO UPDATE SET tx_modelo = EXCLUDED.tx_modelo, id_usuario_atualizacao = EXCLUDED.id_usuario_atualizacao, dh_atualizacao = now()

## Grade (status de cada célula pavimento|lado|atividade): uma célula por vez, sem versão (células são independentes).
SPU.ESCADINHA.CELULA=\
UPDATE escadinha_torre SET tx_grade = CASE WHEN CAST(:valor AS text) IS NULL THEN tx_grade - CAST(:chave AS text) \
       ELSE jsonb_set(tx_grade, ARRAY[CAST(:chave AS text)], CAST(:valor AS jsonb), true) END, \
       id_usuario_atualizacao = :idUsuario, dh_atualizacao = now() \
WHERE id_obra = :idObra AND id_torre = :idTorre

SPS.ESCADINHA.GRADE=\
SELECT CAST(tx_grade AS text) FROM escadinha_torre WHERE id_obra = :idObra AND id_torre = :idTorre

## Tipologias dos apartamentos (sempre pela obra da torre).
SPS.ESCADINHA.TIPOLOGIAS=\
SELECT t.id_tipologia AS id, t.id_torre AS idTorre, t.nm_tipologia AS nmTipologia, (t.tx_imagem IS NOT NULL) AS temImagem \
FROM escadinha_tipologia t JOIN escadinha_torre e ON e.id_torre = t.id_torre \
WHERE e.id_obra = :idObra AND (CAST(:idTorre AS bigint) IS NULL OR t.id_torre = :idTorre) \
  AND (CAST(:id AS bigint) IS NULL OR t.id_tipologia = :id) \
ORDER BY LOWER(t.nm_tipologia)

SPS.ESCADINHA.TIPOLOGIA.IMAGEM=\
SELECT t.tx_imagem FROM escadinha_tipologia t JOIN escadinha_torre e ON e.id_torre = t.id_torre \
WHERE e.id_obra = :idObra AND t.id_tipologia = :id

SPS.ESCADINHA.TIPOLOGIA.NOME_EM_USO=\
SELECT COUNT(*) FROM escadinha_tipologia WHERE id_torre = :idTorre AND LOWER(nm_tipologia) = LOWER(:nome) AND id_tipologia <> :id

SPI.ESCADINHA.TIPOLOGIA=\
INSERT INTO escadinha_tipologia (id_torre, nm_tipologia, tx_imagem, id_usuario_atualizacao) \
VALUES (:idTorre, :nome, :imagem, :idUsuario) RETURNING id_tipologia

SPU.ESCADINHA.TIPOLOGIA=\
UPDATE escadinha_tipologia t SET nm_tipologia = :nome, tx_imagem = CASE WHEN :mudarImagem THEN :imagem ELSE t.tx_imagem END, \
       id_usuario_atualizacao = :idUsuario, dh_atualizacao = now() \
FROM escadinha_torre e WHERE e.id_torre = t.id_torre AND e.id_obra = :idObra AND t.id_tipologia = :id

SPD.ESCADINHA.TIPOLOGIA=\
DELETE FROM escadinha_tipologia t USING escadinha_torre e WHERE e.id_torre = t.id_torre AND e.id_obra = :idObra AND t.id_tipologia = :id
