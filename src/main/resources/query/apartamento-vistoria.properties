    OR TO_CHAR(av.dt_apartamento_vigente, 'DD/MM/YYYY') LIKE :filtraTodos \
    OR av.nm_horario_vistoria LIKE :filtraTodos \
    OR sv.nm_status_vistoria LIKE :filtraTodos \
    OR av.tx_observacao_revistoria LIKE :filtraTodos \
    OR TO_CHAR(av.dt_revistoria_vigente, 'DD/MM/YYYY') LIKE :filtraTodos) \

SPS.LISTAR.APARTAMENTO_VISTORIA_FILTRA_ATRIBUTO=\
SELECT \
    av.id_apartamento_vistoria      AS idApartamentoVistoria, \
    av.nm_apartamento_vistoria      AS nmApartamentoVistoria, \
    av.id_dia_semana                AS idDiaSemana, \
    ds.nm_dia_semana                AS nmDiaSemana, \
    av.dt_apartamento_vigente       AS dtApartamentoVigente, \
    av.nm_horario_vistoria           AS nmHorarioVistoria, \
    av.id_status_vistoria            AS idStatusVistoria, \
    sv.nm_status_vistoria            AS nmStatusVistoria, \
    av.in_marcar_revistoria          AS inMarcarRevistoria, \
    av.tx_observacao_revistoria      AS txObservacaoRevistoria, \
    av.dt_revistoria_vigente         AS dtRevistoriaVigente, \
    (ut.id_termo_reprova IS NOT NULL) AS inTermoAnexado, \
    COALESCE(ut.qt_termos, 0)        AS qtTermos, \
    ut.nr_termo                      AS nrUltimoTermo, \
    ut.nm_situacao                   AS nmSituacaoTermo, \
    COALESCE(ut.qt_fotos, 0)         AS qtFotosTermo, \
    ut.nr_paginas                    AS nrPaginasTermo, \
    COALESCE(ut.nr_paginas_com_foto, 0) AS nrPaginasComFoto \
FROM apartamento_vistoria av \
INNER JOIN dia_semana ds ON av.id_dia_semana = ds.id_dia_semana \
INNER JOIN status_vistoria sv ON av.id_status_vistoria = sv.id_status_vistoria \
LEFT JOIN LATERAL ( \
    SELECT t.id_termo_reprova, t.nr_termo, t.nm_situacao, t.nr_paginas, \
        (SELECT COUNT(*) FROM apartamento_termo_reprova x WHERE x.id_apartamento_vistoria = av.id_apartamento_vistoria) AS qt_termos, \
        (SELECT COUNT(*) FROM apartamento_termo_foto f WHERE f.id_termo_reprova = t.id_termo_reprova) AS qt_fotos, \
        (SELECT COUNT(DISTINCT f.nr_pagina) FROM apartamento_termo_foto f WHERE f.id_termo_reprova = t.id_termo_reprova) AS nr_paginas_com_foto \
    FROM apartamento_termo_reprova t \
    WHERE t.id_apartamento_vistoria = av.id_apartamento_vistoria \
    ORDER BY t.nr_termo DESC \
    LIMIT 1 \
) ut ON TRUE \
WHERE (:nmApartamentoVistoria IS NULL OR av.nm_apartamento_vistoria = :nmApartamentoVistoria) \
    AND (:nmDiaSemana IS NULL OR ds.nm_dia_semana = :nmDiaSemana) \
    AND (:dtApartamentoVigente IS NULL OR av.dt_apartamento_vigente = :dtApartamentoVigente) \
    AND (:nmHorarioVistoria IS NULL OR av.nm_horario_vistoria = :nmHorarioVistoria) \
    AND (:nmStatusVistoria IS NULL OR sv.nm_status_vistoria = :nmStatusVistoria) \
    AND (:txObservacaoRevistoria IS NULL OR av.tx_observacao_revistoria = :txObservacaoRevistoria) \
    AND (:dtRevistoriaVigente IS NULL OR av.dt_revistoria_vigente = :dtRevistoriaVigente)

SPS.LISTAR.INFO_GERAL_APARTAMENTO_VISTORIA=\
SELECT \
    sv.id_status_vistoria, \
    sv.nm_status_vistoria AS nmStatusVistoria, \
    COUNT(a.id_apartamento_vistoria) AS qtApartamentoStatusVistoria, \
    ROUND(COUNT(a.id_apartamento_vistoria) * 100.0/ NULLIF(SUM(COUNT(a.id_apartamento_vistoria)) OVER (), 0),2) AS pcApartamentoStatusVistoria, \
    SUM(COUNT(a.id_apartamento_vistoria)) OVER () AS nrTotalRegistros \
FROM status_vistoria sv \
LEFT JOIN apartamento_vistoria a ON a.id_status_vistoria = sv.id_status_vistoria \
    AND (:dtiApartamentoVistoriaFiltro IS NULL OR a.dt_apartamento_vigente >= :dtiApartamentoVistoriaFiltro) \
    AND (:dtfApartamentoVistoriaFiltro IS NULL OR a.dt_apartamento_vigente <= :dtfApartamentoVistoriaFiltro) \
GROUP BY sv.id_status_vistoria, sv.nm_status_vistoria \
ORDER BY sv.id_status_vistoria