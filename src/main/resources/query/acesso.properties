## Administração de acessos (tela "Acessos" em Configurações).
SPS.ACESSO.USUARIOS=\
SELECT u.id_usuario AS id, u.nm_email AS nmEmail, u.nm_nome AS nmNome, u.id_perfil AS idPerfil, p.cd_perfil AS cdPerfil, \
u.in_ativo AS inAtivo, u.dh_ultimo_login AS dhUltimoLogin, u.nm_celular AS nrCelular, \
u.id_empresa AS idEmpresa, e.nm_empresa AS nmEmpresa, u.id_cargo AS idCargo, c.nm_cargo AS nmCargo, u.id_user_legado AS idUserLegado, \
u.cd_situacao_cadastro AS cdSituacaoCadastro, u.id_obra_solicitada AS idObraSolicitada, o.nm_obra AS nmObraSolicitada \
FROM usuario u JOIN perfil p ON p.id_perfil = u.id_perfil \
LEFT JOIN obra o ON o.id_obra = u.id_obra_solicitada \
LEFT JOIN empresas e ON e.id_empresa = u.id_empresa \
LEFT JOIN cargos c ON c.id_cargo = u.id_cargo \
ORDER BY CASE WHEN u.cd_situacao_cadastro = 'PENDENTE' THEN 0 ELSE 1 END, LOWER(u.nm_nome)

SPS.ACESSO.PERFIS=\
SELECT id_perfil AS idPerfil, cd_perfil AS cdPerfil, nm_perfil AS nmPerfil FROM perfil ORDER BY nm_perfil

SPS.ACESSO.PERMISSOES_PERFIS=\
SELECT id_perfil AS id, cd_modulo AS cdModulo, cd_acao AS cdAcao FROM perfil_permissao

SPS.ACESSO.EXCECOES=\
SELECT id_usuario AS id, cd_modulo AS cdModulo, cd_acao AS cdAcao FROM usuario_permissao

## Incrementa a versão da sessão: o usuário precisa entrar de novo e já recebe os acessos novos.
SPU.ACESSO.PERFIL_SITUACAO=\
UPDATE usuario SET id_perfil = :idPerfil, in_ativo = :ativo, nr_versao_sessao = nr_versao_sessao + 1 \
WHERE id_usuario = :id

SPD.ACESSO.EXCECOES=\
DELETE FROM usuario_permissao WHERE id_usuario = :id

SPI.ACESSO.EXCECAO=\
INSERT INTO usuario_permissao (id_usuario, cd_modulo, cd_acao) VALUES (:id, :cdModulo, :cdAcao)

SPU.ACESSO.DADOS=\
UPDATE usuario SET nm_nome = :nome, nm_celular = :celular, id_empresa = :idEmpresa, id_cargo = :idCargo WHERE id_usuario = :id

## Colaboradores antigos (users) e o vínculo com a base única.
SPS.ACESSO.LEGADOS=\
SELECT us.id_user AS idUser, us.nm_user AS nmColaborador, e.nm_empresa AS nmEmpresa, c.nm_cargo AS nmCargo, \
us.nm_celular AS nrCelular, u.id_usuario AS idUsuario, u.nm_nome AS nmUsuario, \
(SELECT COUNT(*) FROM requisicoes_chaves rc WHERE us.id_user IN (rc.id_user_retirada, rc.id_user_liberacao, rc.id_user_recebimento)) AS qtRetiradas \
FROM users us \
LEFT JOIN empresas e ON e.id_empresa = us.id_empresa \
LEFT JOIN cargos c ON c.id_cargo = us.id_cargo \
LEFT JOIN usuario u ON u.id_user_legado = us.id_user \
ORDER BY LOWER(us.nm_user)

SPU.ACESSO.DESVINCULAR=\
UPDATE usuario SET id_user_legado = NULL WHERE id_user_legado = :idUser

## Vincula e completa celular, empresa e cargo vazios com os dados do colaborador antigo.
SPU.ACESSO.VINCULAR=\
UPDATE usuario u SET id_user_legado = us.id_user, \
nm_celular = COALESCE(u.nm_celular, us.nm_celular), id_empresa = COALESCE(u.id_empresa, us.id_empresa), \
id_cargo = COALESCE(u.id_cargo, us.id_cargo) \
FROM users us WHERE us.id_user = :idUser AND u.id_usuario = :id

SPU.ACESSO.HISTORICO_RETIRADA=\
UPDATE requisicoes_chaves SET id_usuario_retirada = :id WHERE id_user_retirada = :idUser AND id_usuario_retirada IS NULL

SPU.ACESSO.HISTORICO_LIBERACAO=\
UPDATE requisicoes_chaves SET id_usuario_liberacao = :id WHERE id_user_liberacao = :idUser AND id_usuario_liberacao IS NULL

SPU.ACESSO.HISTORICO_RECEBIMENTO=\
UPDATE requisicoes_chaves SET id_usuario_recebimento = :id WHERE id_user_recebimento = :idUser AND id_usuario_recebimento IS NULL

SPU.ACESSO.DECIDIR_CADASTRO=\
UPDATE usuario SET cd_situacao_cadastro = :situacao, in_ativo = :ativo, dh_decisao_cadastro = NOW(), \
nr_versao_sessao = nr_versao_sessao + 1 WHERE id_usuario = :id

SPI.ACESSO.FASE=\
INSERT INTO usuario_fase (id_usuario, id_fase) VALUES (:id, :idFase) ON CONFLICT DO NOTHING

SPS.ACESSO.CONTAR_FASES=\
SELECT COUNT(*) FROM fase WHERE id_fase IN (:ids)
