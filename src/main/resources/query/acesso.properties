## Administração de acessos (tela "Acessos" em Configurações).
SPS.ACESSO.USUARIOS=\
SELECT u.id_usuario AS id, u.nm_email AS nmEmail, u.nm_nome AS nmNome, u.id_perfil AS idPerfil, p.cd_perfil AS cdPerfil, \
u.in_ativo AS inAtivo, u.dh_ultimo_login AS dhUltimoLogin \
FROM usuario u JOIN perfil p ON p.id_perfil = u.id_perfil \
ORDER BY LOWER(u.nm_nome)

SPS.ACESSO.PERFIS=\
SELECT id_perfil AS idPerfil, cd_perfil AS cdPerfil, nm_perfil AS nmPerfil FROM perfil ORDER BY nm_perfil

SPS.ACESSO.PERMISSOES_PERFIS=\
SELECT id_perfil AS id, cd_modulo AS cdModulo, cd_acao AS cdAcao FROM perfil_permissao

SPS.ACESSO.EXCECOES=\
SELECT id_usuario AS id, cd_modulo AS cdModulo, cd_acao AS cdAcao FROM usuario_permissao

## Incrementa a versão da sessão: o usuário precisa entrar de novo e já recebe os acessos novos.
SPU.ACESSO.PERFIL_SITUACAO=\
UPDATE usuario SET id_perfil = :idPerfil, in_ativo = :ativo, nr_versao_sessao = nr_versao_sessao + 1 \
WHERE id_usuario = :id

SPD.ACESSO.EXCECOES=\
DELETE FROM usuario_permissao WHERE id_usuario = :id

SPI.ACESSO.EXCECAO=\
INSERT INTO usuario_permissao (id_usuario, cd_modulo, cd_acao) VALUES (:id, :cdModulo, :cdAcao)
