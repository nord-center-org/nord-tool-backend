## ---------- ativos (fundos) ----------
SPS.FININV.ATIVO.LISTAR=\
SELECT a.id_ativo AS id, a.cd_ticker AS cdTicker, a.nm_ativo AS nmAtivo, a.cd_tipo AS cdTipo, a.id_pessoa AS idPessoa, \
p.nm_pessoa AS nmPessoa, a.vl_cotacao AS vlCotacao, a.dh_cotacao AS dhCotacao, a.in_ativo AS inAtivo, a.nr_versao AS nrVersao \
FROM financeiro_ativo a JOIN financeiro_pessoa p ON p.id_pessoa = a.id_pessoa \
WHERE a.in_ativo = TRUE AND (:idPessoa IS NULL OR a.id_pessoa = :idPessoa) ORDER BY a.cd_ticker, p.nr_ordem

SPS.FININV.ATIVO.BUSCAR=\
SELECT a.id_ativo AS id, a.cd_ticker AS cdTicker, a.nm_ativo AS nmAtivo, a.cd_tipo AS cdTipo, a.id_pessoa AS idPessoa, \
p.nm_pessoa AS nmPessoa, a.vl_cotacao AS vlCotacao, a.dh_cotacao AS dhCotacao, a.in_ativo AS inAtivo, a.nr_versao AS nrVersao \
FROM financeiro_ativo a JOIN financeiro_pessoa p ON p.id_pessoa = a.id_pessoa WHERE a.id_ativo = :id

SPS.FININV.ATIVO.BUSCAR_TICKER=\
SELECT a.id_ativo AS id, a.cd_ticker AS cdTicker, a.nm_ativo AS nmAtivo, a.cd_tipo AS cdTipo, a.id_pessoa AS idPessoa, \
p.nm_pessoa AS nmPessoa, a.vl_cotacao AS vlCotacao, a.dh_cotacao AS dhCotacao, a.in_ativo AS inAtivo, a.nr_versao AS nrVersao \
FROM financeiro_ativo a JOIN financeiro_pessoa p ON p.id_pessoa = a.id_pessoa \
WHERE a.cd_ticker = :cdTicker AND a.id_pessoa = :idPessoa

SPI.FININV.ATIVO.INSERIR=\
INSERT INTO financeiro_ativo (cd_ticker, nm_ativo, cd_tipo, id_pessoa) VALUES (:cdTicker, :nmAtivo, 'FII', :idPessoa) RETURNING id_ativo

SPU.FININV.ATIVO.ALTERAR=\
UPDATE financeiro_ativo SET nm_ativo = :nmAtivo, in_ativo = :inAtivo, nr_versao = nr_versao + 1 \
WHERE id_ativo = :id AND nr_versao = :nrVersao

SPU.FININV.ATIVO.COTACAO=\
UPDATE financeiro_ativo SET vl_cotacao = :vlCotacao, dh_cotacao = :dhCotacao WHERE id_ativo = :id

## ---------- operações ----------
SPS.FININV.OPERACAO.LISTAR=\
SELECT id_operacao AS id, cd_requisicao::text AS cdRequisicao, id_ativo AS idAtivo, dt_operacao AS dtOperacao, \
cd_tipo AS cdTipo, qt_cotas AS qtCotas, vl_preco AS vlPreco \
FROM financeiro_operacao WHERE id_ativo IN (:idsAtivo) ORDER BY dt_operacao, id_operacao

SPS.FININV.OPERACAO.BUSCAR=\
SELECT id_operacao AS id, cd_requisicao::text AS cdRequisicao, id_ativo AS idAtivo, dt_operacao AS dtOperacao, \
cd_tipo AS cdTipo, qt_cotas AS qtCotas, vl_preco AS vlPreco FROM financeiro_operacao WHERE id_operacao = :id

SPS.FININV.OPERACAO.BUSCAR_REQUISICAO=\
SELECT id_ativo FROM financeiro_operacao WHERE cd_requisicao = CAST(:cdRequisicao AS uuid)

SPI.FININV.OPERACAO.INSERIR=\
INSERT INTO financeiro_operacao (cd_requisicao, id_ativo, dt_operacao, cd_tipo, qt_cotas, vl_preco) \
VALUES (CAST(:cdRequisicao AS uuid), :idAtivo, :dtOperacao, :cdTipo, :qtCotas, :vlPreco) \
ON CONFLICT (cd_requisicao) DO NOTHING RETURNING id_operacao

SPD.FININV.OPERACAO.DELETAR=\
DELETE FROM financeiro_operacao WHERE id_operacao = :id

## ---------- proventos ----------
SPS.FININV.PROVENTO.LISTAR=\
SELECT id_provento AS id, id_ativo AS idAtivo, dt_com AS dtCom, dt_pagamento AS dtPagamento, vl_por_cota AS vlPorCota, \
cd_origem AS cdOrigem FROM financeiro_provento WHERE id_ativo IN (:idsAtivo) ORDER BY dt_pagamento DESC, id_provento DESC

SPS.FININV.PROVENTO.BUSCAR=\
SELECT id_provento AS id, id_ativo AS idAtivo, dt_com AS dtCom, dt_pagamento AS dtPagamento, vl_por_cota AS vlPorCota, \
cd_origem AS cdOrigem FROM financeiro_provento WHERE id_provento = :id

## Manual sempre vale; o importado nunca sobrescreve o que foi digitado.
SPI.FININV.PROVENTO.MANUAL=\
INSERT INTO financeiro_provento (id_ativo, dt_com, dt_pagamento, vl_por_cota, cd_origem) \
VALUES (:idAtivo, :dtCom, :dtPagamento, :vlPorCota, 'MANUAL') \
ON CONFLICT (id_ativo, dt_com) DO UPDATE SET dt_pagamento = EXCLUDED.dt_pagamento, vl_por_cota = EXCLUDED.vl_por_cota, cd_origem = 'MANUAL'

SPI.FININV.PROVENTO.IMPORTADO=\
INSERT INTO financeiro_provento (id_ativo, dt_com, dt_pagamento, vl_por_cota, cd_origem) \
VALUES (:idAtivo, :dtCom, :dtPagamento, :vlPorCota, 'COTACAO') \
ON CONFLICT (id_ativo, dt_com) DO UPDATE SET dt_pagamento = EXCLUDED.dt_pagamento, vl_por_cota = EXCLUDED.vl_por_cota \
WHERE financeiro_provento.cd_origem = 'COTACAO'

SPD.FININV.PROVENTO.DELETAR=\
DELETE FROM financeiro_provento WHERE id_provento = :id
