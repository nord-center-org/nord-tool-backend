SPI.CRONOGRAMA_SEMANAL.INSERIR=\
INSERT INTO cronograma_semanal ( \
    id_dia_semana, \
    nm_cronograma_semanal, \
    nm_horario, \
    nm_cronograma_categoria, \
    nm_status_cronograma, \
    tx_observacao, \
    dt_prazo, \
    dt_finalizacao, \
    nm_tag, \
    dt_agendamento, \
    dt_fim_agendamento, \
    in_cronograma_fixo, \
    id_usuario_dono \
    ) VALUES ( \
    :idDiaSemana, \
    :nmCronogramaSemanal, \
    :nmHorario, \
    :nmCronogramaCategoria, \
    :nmStatusCronograma, \
    :txObservacao, \
    :dtPrazo, \
    :dtFinalizacao, \
    :nmTag, \
    :dtAgendamento, \
    :dtFimAgendamento, \
    :inCronogramaFixo, \
    :idUsuario \
)

SPU.CRONOGRAMA_SEMANAL.ALTERAR=\
UPDATE cronograma_semanal \
SET \
    id_dia_semana        = :idDiaSemana, \
    nm_cronograma_semanal = :nmCronogramaSemanal, \
    nm_horario           = :nmHorario, \
    nm_cronograma_categoria         = :nmCronogramaCategoria, \
    nm_status_cronograma = :nmStatusCronograma, \
    tx_observacao        = :txObservacao, \
    dt_prazo             = :dtPrazo, \
    dt_finalizacao       = :dtFinalizacao, \
    nm_tag               = :nmTag, \
    dt_agendamento       = :dtAgendamento, \
    dt_fim_agendamento   = :dtFimAgendamento, \
    in_cronograma_fixo              = :inCronogramaFixo, \
    dt_alteracao         = NOW() \
WHERE id_cronograma_semanal = :id AND (id_usuario_dono = :idUsuario OR (:verSemDono AND id_usuario_dono IS NULL))

## Mover na esteira: qualquer pessoa que enxerga o item (dono, compartilhado, mesma equipe, admin) muda só o status.
SPU.CRONOGRAMA_SEMANAL.STATUS=\
UPDATE cronograma_semanal cs SET nm_status_cronograma = :status, dt_alteracao = NOW() \
WHERE cs.id_cronograma_semanal = :id AND (cs.id_usuario_dono = :idUsuario OR (:verSemDono AND cs.id_usuario_dono IS NULL) OR :verTudo OR EXISTS (SELECT 1 FROM cronograma_compartilhamento cc WHERE cc.id_cronograma_semanal = cs.id_cronograma_semanal AND cc.id_usuario = :idUsuario) OR (:verEquipe AND EXISTS (SELECT 1 FROM cronograma_equipe_membro m1 JOIN cronograma_equipe_membro m2 ON m2.id_equipe = m1.id_equipe WHERE m1.id_usuario = :idUsuario AND m2.id_usuario = cs.id_usuario_dono)))

SPD.CRONOGRAMA_SEMANAL.DELETAR=\
DELETE FROM cronograma_semanal WHERE id_cronograma_semanal = :id AND (id_usuario_dono = :idUsuario OR (:verSemDono AND id_usuario_dono IS NULL))

SPS.CRONOGRAMA_SEMANAL.LISTAR=\
SELECT \
    cs.id_cronograma_semanal AS id, \
    cs.id_dia_semana AS idDiaSemana, \
    ds.nm_dia_semana AS nmDiaSemana, \
    cs.nm_cronograma_semanal AS nmCronogramaSemanal, \
    cs.nm_horario AS nmHorario, \
    cs.nm_cronograma_categoria AS nmCronogramaCategoria, \
    cs.nm_status_cronograma AS nmStatusCronograma, \
    cs.tx_observacao AS txObservacao, \
    cs.dt_prazo AS dtPrazo, \
    cs.dt_finalizacao AS dtFinalizacao, \
    cs.nm_tag AS nmTag, \
    cs.dt_agendamento AS dtAgendamento, \
    cs.dt_fim_agendamento AS dtFimAgendamento, \
    cs.in_cronograma_fixo AS inCronogramaFixo, \
    cs.nm_usuario nmUsuario, \
    cs.dt_inclusao AS dtInclusao, \
    cs.id_usuario_dono AS idDono, \
    ud.nm_nome AS nmDono, \
    (cs.id_usuario_dono = :idUsuario OR (:verSemDono AND cs.id_usuario_dono IS NULL)) AS inProprio, \
    (SELECT string_agg(cc.id_usuario::text, ',' ORDER BY cc.id_usuario) FROM cronograma_compartilhamento cc \
      WHERE cc.id_cronograma_semanal = cs.id_cronograma_semanal) AS txCompartilhados, \
    cs.dt_alteracao AS dtAlteracao \
FROM cronograma_semanal cs \
LEFT JOIN dia_semana ds ON cs.id_dia_semana = ds.id_dia_semana \
LEFT JOIN usuario ud ON ud.id_usuario = cs.id_usuario_dono \
WHERE (cs.id_usuario_dono = :idUsuario OR (:verSemDono AND cs.id_usuario_dono IS NULL) OR :verTudo OR EXISTS (SELECT 1 FROM cronograma_compartilhamento cc WHERE cc.id_cronograma_semanal = cs.id_cronograma_semanal AND cc.id_usuario = :idUsuario) OR (:verEquipe AND EXISTS (SELECT 1 FROM cronograma_equipe_membro m1 JOIN cronograma_equipe_membro m2 ON m2.id_equipe = m1.id_equipe WHERE m1.id_usuario = :idUsuario AND m2.id_usuario = cs.id_usuario_dono)))

SPS.CRONOGRAMA_SEMANAL.BUSTAR_POR_ID=\
SELECT \
    cs.id_cronograma_semanal AS id, \
    cs.id_dia_semana AS idDiaSemana, \
    ds.nm_dia_semana AS nmDiaSemana, \
    cs.nm_cronograma_semanal AS nmCronogramaSemanal, \
    cs.nm_horario AS nmHorario, \
    cs.nm_cronograma_categoria AS nmCronogramaCategoria, \
    cs.nm_status_cronograma AS nmStatusCronograma, \
    cs.tx_observacao AS txObservacao, \
    cs.dt_prazo AS dtPrazo, \
    cs.dt_finalizacao AS dtFinalizacao, \
    cs.nm_tag AS nmTag, \
    cs.dt_agendamento AS dtAgendamento, \
    cs.dt_fim_agendamento AS dtFimAgendamento, \
    cs.in_cronograma_fixo AS inCronogramaFixo, \
    cs.nm_usuario nmUsuario, \
    cs.dt_inclusao AS dtInclusao, \
    cs.id_usuario_dono AS idDono, \
    ud.nm_nome AS nmDono, \
    (cs.id_usuario_dono = :idUsuario OR (:verSemDono AND cs.id_usuario_dono IS NULL)) AS inProprio, \
    (SELECT string_agg(cc.id_usuario::text, ',' ORDER BY cc.id_usuario) FROM cronograma_compartilhamento cc \
      WHERE cc.id_cronograma_semanal = cs.id_cronograma_semanal) AS txCompartilhados, \
    cs.dt_alteracao AS dtAlteracao \
FROM cronograma_semanal cs \
LEFT JOIN dia_semana ds ON cs.id_dia_semana = ds.id_dia_semana \
LEFT JOIN usuario ud ON ud.id_usuario = cs.id_usuario_dono \
WHERE cs.id_cronograma_semanal = :id AND (cs.id_usuario_dono = :idUsuario OR (:verSemDono AND cs.id_usuario_dono IS NULL) OR :verTudo OR EXISTS (SELECT 1 FROM cronograma_compartilhamento cc WHERE cc.id_cronograma_semanal = cs.id_cronograma_semanal AND cc.id_usuario = :idUsuario) OR (:verEquipe AND EXISTS (SELECT 1 FROM cronograma_equipe_membro m1 JOIN cronograma_equipe_membro m2 ON m2.id_equipe = m1.id_equipe WHERE m1.id_usuario = :idUsuario AND m2.id_usuario = cs.id_usuario_dono)))

SPS.CRONOGRAMA_SEMANAL_EXCECAO.LISTAR=\
SELECT \
    e.id_cronograma_semanal AS idCronogramaSemanal, \
    TO_CHAR(e.dt_excecao, 'YYYY-MM-DD') AS dtExcecao \
FROM cronograma_semanal_excecao e \
WHERE EXISTS (SELECT 1 FROM cronograma_semanal cs WHERE cs.id_cronograma_semanal = e.id_cronograma_semanal AND (cs.id_usuario_dono = :idUsuario OR (:verSemDono AND cs.id_usuario_dono IS NULL) OR :verTudo OR EXISTS (SELECT 1 FROM cronograma_compartilhamento cc WHERE cc.id_cronograma_semanal = cs.id_cronograma_semanal AND cc.id_usuario = :idUsuario) OR (:verEquipe AND EXISTS (SELECT 1 FROM cronograma_equipe_membro m1 JOIN cronograma_equipe_membro m2 ON m2.id_equipe = m1.id_equipe WHERE m1.id_usuario = :idUsuario AND m2.id_usuario = cs.id_usuario_dono)))) \
ORDER BY e.dt_excecao

SPI.CRONOGRAMA_SEMANAL_EXCECAO.INSERIR=\
INSERT INTO cronograma_semanal_excecao (id_cronograma_semanal, dt_excecao) \
VALUES (:id, :data) \
ON CONFLICT DO NOTHING

SPD.CRONOGRAMA_SEMANAL_EXCECAO.DELETAR=\
DELETE FROM cronograma_semanal_excecao \
WHERE id_cronograma_semanal = :id AND dt_excecao = :data

## ---------- compartilhamento (cronograma pessoal) ----------
SPD.CRONOGRAMA_SEMANAL_COMPARTILHAMENTO.LIMPAR=\
DELETE FROM cronograma_compartilhamento WHERE id_cronograma_semanal = :id

SPI.CRONOGRAMA_SEMANAL_COMPARTILHAMENTO.INSERIR=\
INSERT INTO cronograma_compartilhamento (id_cronograma_semanal, id_usuario) VALUES (:id, :idUsuarioDestino) ON CONFLICT DO NOTHING

## Pessoas com quem dá para compartilhar: usuários ativos e aprovados. inEquipe = abaixo de mim na hierarquia.
SPS.CRONOGRAMA_SEMANAL.PESSOAS=\
WITH RECURSIVE equipe AS ( \
    SELECT id_usuario FROM usuario WHERE id_superior = :idUsuario \
    UNION \
    SELECT u.id_usuario FROM usuario u JOIN equipe e ON u.id_superior = e.id_usuario \
) \
SELECT u.id_usuario AS id, u.nm_nome AS nmNome, c.nm_cargo AS nmCargo, \
    (u.id_usuario IN (SELECT id_usuario FROM equipe)) AS inEquipe \
FROM usuario u LEFT JOIN cargos c ON c.id_cargo = u.id_cargo \
WHERE u.in_ativo = TRUE AND u.cd_situacao_cadastro = 'APROVADO' AND u.id_usuario <> :idUsuario \
ORDER BY LOWER(u.nm_nome)

SPS.CRONOGRAMA_SEMANAL.USUARIOS_ATIVOS=\
SELECT COUNT(*) FROM usuario WHERE in_ativo = TRUE AND id_usuario IN (:ids)

## ---------- equipes por obra ----------
## Equipes que a pessoa enxerga (membro, ou todas para o admin do cronograma); :idObra nulo = todas as obras.
SPS.CRONOGRAMA_EQUIPE.LISTAR=\
SELECT e.id_equipe AS id, e.id_obra AS idObra, o.nm_obra AS nmObra, e.nm_equipe AS nmEquipe, e.id_lider AS idLider, ul.nm_nome AS nmLider, \
    (SELECT string_agg(m.id_usuario::text, ',' ORDER BY m.id_usuario) FROM cronograma_equipe_membro m WHERE m.id_equipe = e.id_equipe) AS txMembros \
FROM cronograma_equipe e \
JOIN obra o ON o.id_obra = e.id_obra \
LEFT JOIN usuario ul ON ul.id_usuario = e.id_lider \
WHERE (CAST(:idObra AS BIGINT) IS NULL OR e.id_obra = :idObra) \
  AND (:verTudo OR EXISTS (SELECT 1 FROM cronograma_equipe_membro m WHERE m.id_equipe = e.id_equipe AND m.id_usuario = :idUsuario)) \
ORDER BY LOWER(o.nm_obra), LOWER(e.nm_equipe)

SPI.CRONOGRAMA_EQUIPE.INSERIR=\
INSERT INTO cronograma_equipe (id_obra, nm_equipe, id_lider) VALUES (:idObra, :nmEquipe, :idLider) RETURNING id_equipe

SPU.CRONOGRAMA_EQUIPE.ALTERAR=\
UPDATE cronograma_equipe SET nm_equipe = :nmEquipe, id_lider = :idLider WHERE id_equipe = :id AND id_obra = :idObra

SPD.CRONOGRAMA_EQUIPE.EXCLUIR=\
DELETE FROM cronograma_equipe WHERE id_equipe = :id AND id_obra = :idObra

SPS.CRONOGRAMA_EQUIPE.NOME_EM_USO=\
SELECT COUNT(*) FROM cronograma_equipe WHERE id_obra = :idObra AND LOWER(nm_equipe) = LOWER(:nmEquipe) AND id_equipe <> :id

SPD.CRONOGRAMA_EQUIPE.MEMBROS=\
DELETE FROM cronograma_equipe_membro WHERE id_equipe = :id

SPI.CRONOGRAMA_EQUIPE.MEMBRO=\
INSERT INTO cronograma_equipe_membro (id_equipe, id_usuario) VALUES (:id, :idUsuario) ON CONFLICT DO NOTHING

## Equipe pela hierarquia: o líder e todos abaixo dele (ativos e aprovados). UNION evita laço infinito em ciclos.
SPS.CRONOGRAMA_EQUIPE.HIERARQUIA=\
WITH RECURSIVE abaixo AS ( \
    SELECT id_usuario FROM usuario WHERE id_superior = :idLider \
    UNION \
    SELECT u.id_usuario FROM usuario u JOIN abaixo a ON u.id_superior = a.id_usuario \
) \
SELECT u.id_usuario FROM usuario u \
WHERE (u.id_usuario = :idLider OR u.id_usuario IN (SELECT id_usuario FROM abaixo)) \
  AND u.in_ativo = TRUE AND u.cd_situacao_cadastro = 'APROVADO' \
ORDER BY u.id_usuario
