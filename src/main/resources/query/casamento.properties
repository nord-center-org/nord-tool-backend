## ---------- configuração ----------
SPS.CASAMENTO.CONFIGURACAO.LISTAR=\
SELECT cd_chave AS cdChave, vl_valor AS vlValor FROM casamento_configuracao

SPI.CASAMENTO.CONFIGURACAO.SALVAR=\
INSERT INTO casamento_configuracao (cd_chave, vl_valor) VALUES (:cdChave, :vlValor) \
ON CONFLICT (cd_chave) DO UPDATE SET vl_valor = EXCLUDED.vl_valor

## ---------- fornecedores ----------
SPS.CASAMENTO.FORNECEDOR.LISTAR=\
SELECT f.id_fornecedor AS id, f.nm_fornecedor AS nmFornecedor, f.nm_categoria AS nmCategoria, \
f.tx_contato AS txContato, f.nm_status AS nmStatus, f.vl_valor AS vlValor, f.tx_observacao AS txObservacao, \
f.dh_alteracao AS dhAlteracao, \
(SELECT COUNT(*) FROM casamento_fornecedor_anexo a WHERE a.id_fornecedor = f.id_fornecedor) AS qtAnexos \
FROM casamento_fornecedor f ORDER BY LOWER(f.nm_fornecedor), f.id_fornecedor

SPS.CASAMENTO.FORNECEDOR.BUSCAR=\
SELECT f.id_fornecedor AS id, f.nm_fornecedor AS nmFornecedor, f.nm_categoria AS nmCategoria, \
f.tx_contato AS txContato, f.nm_status AS nmStatus, f.vl_valor AS vlValor, f.tx_observacao AS txObservacao, \
f.dh_alteracao AS dhAlteracao, \
(SELECT COUNT(*) FROM casamento_fornecedor_anexo a WHERE a.id_fornecedor = f.id_fornecedor) AS qtAnexos \
FROM casamento_fornecedor f WHERE f.id_fornecedor = :id

SPI.CASAMENTO.FORNECEDOR.INSERIR=\
INSERT INTO casamento_fornecedor (nm_fornecedor, nm_categoria, tx_contato, nm_status, vl_valor, tx_observacao) \
VALUES (:nmFornecedor, :nmCategoria, :txContato, :nmStatus, :vlValor, :txObservacao)

SPU.CASAMENTO.FORNECEDOR.ALTERAR=\
UPDATE casamento_fornecedor SET nm_fornecedor = :nmFornecedor, nm_categoria = :nmCategoria, tx_contato = :txContato, \
nm_status = :nmStatus, vl_valor = :vlValor, tx_observacao = :txObservacao, dh_alteracao = now() \
WHERE id_fornecedor = :id

SPD.CASAMENTO.FORNECEDOR.DELETAR=\
DELETE FROM casamento_fornecedor WHERE id_fornecedor = :id

## ---------- anexos do fornecedor ----------
SPS.CASAMENTO.ANEXO.LISTAR=\
SELECT a.id_anexo AS id, a.id_fornecedor AS idFornecedor, a.id_arquivo AS idArquivo, arq.nm_arquivo AS nmArquivo, \
arq.nm_content_type AS nmContentType, arq.nr_tamanho_bytes AS nrTamanhoBytes, a.tx_descricao AS txDescricao, \
a.dh_criacao AS dhCriacao \
FROM casamento_fornecedor_anexo a JOIN arquivo_armazenado arq ON arq.id_arquivo = a.id_arquivo \
WHERE a.id_fornecedor = :idFornecedor ORDER BY a.id_anexo

SPS.CASAMENTO.ANEXO.BUSCAR=\
SELECT a.id_anexo AS id, a.id_fornecedor AS idFornecedor, a.id_arquivo AS idArquivo, arq.nm_arquivo AS nmArquivo, \
arq.nm_content_type AS nmContentType, arq.nr_tamanho_bytes AS nrTamanhoBytes, a.tx_descricao AS txDescricao, \
a.dh_criacao AS dhCriacao \
FROM casamento_fornecedor_anexo a JOIN arquivo_armazenado arq ON arq.id_arquivo = a.id_arquivo \
WHERE a.id_anexo = :id

SPI.CASAMENTO.ANEXO.INSERIR=\
INSERT INTO casamento_fornecedor_anexo (id_fornecedor, id_arquivo, tx_descricao) \
VALUES (:idFornecedor, :idArquivo, :txDescricao)

SPD.CASAMENTO.ANEXO.DELETAR=\
DELETE FROM casamento_fornecedor_anexo WHERE id_anexo = :id

## ---------- convidados ----------
SPS.CASAMENTO.CONVIDADO.LISTAR=\
SELECT c.id_convidado AS id, c.nm_convidado AS nmConvidado, c.nm_grupo AS nmGrupo, c.nr_telefone AS nrTelefone, \
c.nm_relacao AS nmRelacao, c.nm_status AS nmStatus, c.nr_acompanhantes AS nrAcompanhantes, c.nm_mesa AS nmMesa, \
c.id_convidado_principal AS idConvidadoPrincipal, p.nm_convidado AS nmConvidadoPrincipal, c.nm_cortejo AS nmCortejo \
FROM casamento_convidado c LEFT JOIN casamento_convidado p ON p.id_convidado = c.id_convidado_principal ORDER BY LOWER(c.nm_convidado), c.id_convidado

SPS.CASAMENTO.CONVIDADO.BUSCAR=\
SELECT c.id_convidado AS id, c.nm_convidado AS nmConvidado, c.nm_grupo AS nmGrupo, c.nr_telefone AS nrTelefone, \
c.nm_relacao AS nmRelacao, c.nm_status AS nmStatus, c.nr_acompanhantes AS nrAcompanhantes, c.nm_mesa AS nmMesa, \
c.id_convidado_principal AS idConvidadoPrincipal, p.nm_convidado AS nmConvidadoPrincipal, c.nm_cortejo AS nmCortejo \
FROM casamento_convidado c LEFT JOIN casamento_convidado p ON p.id_convidado = c.id_convidado_principal WHERE c.id_convidado = :id

SPI.CASAMENTO.CONVIDADO.INSERIR=\
INSERT INTO casamento_convidado (nm_convidado, nm_grupo, nr_telefone, nm_relacao, nm_status, nr_acompanhantes, nm_mesa, id_convidado_principal, nm_cortejo) \
VALUES (:nmConvidado, :nmGrupo, :nrTelefone, :nmRelacao, :nmStatus, :nrAcompanhantes, :nmMesa, :idConvidadoPrincipal, :nmCortejo)

SPU.CASAMENTO.CONVIDADO.ALTERAR=\
UPDATE casamento_convidado SET nm_convidado = :nmConvidado, nm_grupo = :nmGrupo, nr_telefone = :nrTelefone, \
nm_relacao = :nmRelacao, nm_status = :nmStatus, nr_acompanhantes = :nrAcompanhantes, nm_mesa = :nmMesa, \
id_convidado_principal = :idConvidadoPrincipal, nm_cortejo = :nmCortejo, dh_alteracao = now() WHERE id_convidado = :id

SPD.CASAMENTO.CONVIDADO.DELETAR=\
DELETE FROM casamento_convidado WHERE id_convidado = :id

## ---------- marcos ----------
SPS.CASAMENTO.MARCO.LISTAR=\
SELECT m.id_marco AS id, m.nm_titulo AS nmTitulo, m.dt_prazo AS dtPrazo, m.in_concluido AS inConcluido, \
m.tx_observacao AS txObservacao \
FROM casamento_marco m ORDER BY m.dt_prazo ASC NULLS LAST, m.id_marco

SPS.CASAMENTO.MARCO.BUSCAR=\
SELECT m.id_marco AS id, m.nm_titulo AS nmTitulo, m.dt_prazo AS dtPrazo, m.in_concluido AS inConcluido, \
m.tx_observacao AS txObservacao \
FROM casamento_marco m WHERE m.id_marco = :id

SPS.CASAMENTO.MARCO.PROXIMOS=\
SELECT m.id_marco AS id, m.nm_titulo AS nmTitulo, m.dt_prazo AS dtPrazo, m.in_concluido AS inConcluido, \
m.tx_observacao AS txObservacao \
FROM casamento_marco m WHERE m.in_concluido = FALSE \
ORDER BY m.dt_prazo ASC NULLS LAST, m.id_marco LIMIT :limite

SPS.CASAMENTO.MARCO.CONTAR=\
SELECT COUNT(*) FROM casamento_marco

SPI.CASAMENTO.MARCO.INSERIR=\
INSERT INTO casamento_marco (nm_titulo, dt_prazo, in_concluido, tx_observacao) \
VALUES (:nmTitulo, :dtPrazo, :inConcluido, :txObservacao)

SPU.CASAMENTO.MARCO.ALTERAR=\
UPDATE casamento_marco SET nm_titulo = :nmTitulo, dt_prazo = :dtPrazo, tx_observacao = :txObservacao, \
dh_alteracao = now() WHERE id_marco = :id

SPU.CASAMENTO.MARCO.CONCLUIR=\
UPDATE casamento_marco SET in_concluido = :inConcluido, dh_alteracao = now() WHERE id_marco = :id

SPD.CASAMENTO.MARCO.DELETAR=\
DELETE FROM casamento_marco WHERE id_marco = :id

## ---------- dashboard ----------
SPS.CASAMENTO.DASHBOARD.TOTAIS=\
SELECT \
(SELECT COUNT(*) FROM casamento_fornecedor) AS qtFornecedores, \
(SELECT COUNT(*) FROM casamento_fornecedor WHERE nm_status = 'CONTRATADO') AS qtFornecedoresContratados, \
(SELECT COALESCE(SUM(vl_valor), 0) FROM casamento_fornecedor WHERE nm_status = 'CONTRATADO') AS vlContratado, \
(SELECT COUNT(*) FROM casamento_convidado) AS qtConvidados, \
(SELECT COUNT(*) FROM casamento_convidado WHERE nm_status = 'CONFIRMADO') AS qtConvidadosConfirmados, \
(SELECT COALESCE(SUM(1 + nr_acompanhantes), 0) FROM casamento_convidado WHERE nm_status = 'CONFIRMADO') AS qtPessoasConfirmadas, \
(SELECT COUNT(*) FROM casamento_marco) AS qtMarcos, \
(SELECT COUNT(*) FROM casamento_marco WHERE in_concluido = TRUE) AS qtMarcosConcluidos
