## Relatório fotográfico (modelos, relatórios, itens e fotos).
## Escopo de fase do relatório: (:todasFases OR r.id_fase = ANY(...) OR (:verSemFase AND r.id_fase IS NULL)).

SPS.RELATORIO.MODELO.LISTAR=\
SELECT id_modelo AS id, nm_modelo AS nmModelo, tx_descricao AS txDescricao, nr_fotos_pagina AS nrFotosPagina, \
COALESCE(cd_layout, 'R' || nr_fotos_pagina) AS cdLayout, cd_fonte AS cdFonte, in_cabecalho AS inCabecalho, \
nr_opacidade_fundo AS nrOpacidadeFundo, id_arquivo_fundo AS idArquivoFundo, id_arquivo_icone AS idArquivoIcone, \
in_ativo AS inAtivo, nr_versao AS nrVersao \
FROM relatorio_modelo ORDER BY LOWER(nm_modelo)

SPS.RELATORIO.MODELO.ITENS=\
SELECT id_modelo_item AS id, id_modelo AS idModelo, nr_ordem AS nrOrdem, nm_item AS nmItem, tx_orientacao AS txOrientacao \
FROM relatorio_modelo_item ORDER BY id_modelo, nr_ordem, id_modelo_item

SPI.RELATORIO.MODELO.INSERIR=\
INSERT INTO relatorio_modelo (nm_modelo, tx_descricao, nr_fotos_pagina, cd_layout, cd_fonte, in_cabecalho, nr_opacidade_fundo, in_ativo) \
VALUES (:nmModelo, :txDescricao, :nrFotosPagina, :cdLayout, :cdFonte, :inCabecalho, :nrOpacidadeFundo, :inAtivo) RETURNING id_modelo

SPU.RELATORIO.MODELO.ALTERAR=\
UPDATE relatorio_modelo SET nm_modelo = :nmModelo, tx_descricao = :txDescricao, nr_fotos_pagina = :nrFotosPagina, \
cd_layout = :cdLayout, cd_fonte = :cdFonte, in_cabecalho = :inCabecalho, nr_opacidade_fundo = :nrOpacidadeFundo, \
in_ativo = :inAtivo, nr_versao = nr_versao + 1, dh_alteracao = now() \
WHERE id_modelo = :id AND nr_versao = :nrVersao

SPD.RELATORIO.MODELO.ITENS.LIMPAR=\
DELETE FROM relatorio_modelo_item WHERE id_modelo = :idModelo

SPI.RELATORIO.MODELO.ITEM.INSERIR=\
INSERT INTO relatorio_modelo_item (id_modelo, nr_ordem, nm_item, tx_orientacao) VALUES (:idModelo, :nrOrdem, :nmItem, :txOrientacao)

SPS.RELATORIO.LISTAR=\
SELECT r.id_relatorio AS id, r.nm_titulo AS nmTitulo, r.nm_local AS nmLocal, r.dt_relatorio AS dtRelatorio, \
r.nr_fotos_pagina AS nrFotosPagina, COALESCE(r.cd_layout, 'R' || r.nr_fotos_pagina) AS cdLayout, r.cd_status AS cdStatus, r.id_modelo AS idModelo, m.nm_modelo AS nmModelo, \
r.id_fase AS idFase, f.nm_fase AS nmFase, r.id_usuario_autor AS idAutor, u.nm_nome AS nmAutor, r.nr_versao AS nrVersao, \
(SELECT COUNT(*) FROM relatorio_foto ft JOIN relatorio_fotografico_item it ON it.id_relatorio_item = ft.id_relatorio_item \
 WHERE it.id_relatorio = r.id_relatorio) AS qtFotos \
FROM relatorio_fotografico r \
LEFT JOIN relatorio_modelo m ON m.id_modelo = r.id_modelo \
LEFT JOIN fase f ON f.id_fase = r.id_fase \
LEFT JOIN usuario u ON u.id_usuario = r.id_usuario_autor \
WHERE (:todasFases OR r.id_fase = ANY(CAST(string_to_array(:fasesCsv, ',') AS bigint[])) OR (:verSemFase AND r.id_fase IS NULL)) \
  AND (CAST(:id AS bigint) IS NULL OR r.id_relatorio = :id) \
ORDER BY r.dt_relatorio DESC, r.id_relatorio DESC

SPS.RELATORIO.ITENS=\
SELECT id_relatorio_item AS id, id_relatorio AS idRelatorio, nr_ordem AS nrOrdem, nm_item AS nmItem, \
tx_orientacao AS txOrientacao, tx_resposta AS txResposta \
FROM relatorio_fotografico_item WHERE id_relatorio = :idRelatorio ORDER BY nr_ordem, id_relatorio_item

SPS.RELATORIO.FOTOS=\
SELECT ft.id_foto AS id, ft.id_relatorio_item AS idItem, ft.id_arquivo AS idArquivo, ft.nr_ordem AS nrOrdem, \
ft.tx_legenda AS txLegenda, ft.id_arquivo AS idImagem, ft.dh_criacao AS dhCriacao \
FROM relatorio_foto ft JOIN relatorio_fotografico_item it ON it.id_relatorio_item = ft.id_relatorio_item \
WHERE it.id_relatorio = :idRelatorio ORDER BY it.nr_ordem, ft.nr_ordem, ft.id_foto

SPS.RELATORIO.ITEM.DONO=\
SELECT id_relatorio FROM relatorio_fotografico_item WHERE id_relatorio_item = :id

SPS.RELATORIO.FOTO.BUSCAR=\
SELECT ft.id_foto AS id, ft.id_relatorio_item AS idItem, ft.id_arquivo AS idArquivo, ft.nr_ordem AS nrOrdem, \
ft.tx_legenda AS txLegenda, ft.id_arquivo AS idImagem, ft.dh_criacao AS dhCriacao, it.id_relatorio AS idRelatorio \
FROM relatorio_foto ft JOIN relatorio_fotografico_item it ON it.id_relatorio_item = ft.id_relatorio_item \
WHERE ft.id_foto = :id

SPI.RELATORIO.INSERIR=\
INSERT INTO relatorio_fotografico (id_modelo, id_fase, nm_titulo, nm_local, dt_relatorio, nr_fotos_pagina, cd_layout, id_usuario_autor) \
VALUES (:idModelo, :idFase, :nmTitulo, :nmLocal, :dtRelatorio, :nrFotosPagina, :cdLayout, :idAutor) RETURNING id_relatorio

SPU.RELATORIO.ALTERAR=\
UPDATE relatorio_fotografico SET nm_titulo = :nmTitulo, nm_local = :nmLocal, dt_relatorio = :dtRelatorio, \
nr_fotos_pagina = :nrFotosPagina, cd_layout = :cdLayout, nr_versao = nr_versao + 1, dh_alteracao = now() \
WHERE id_relatorio = :id AND nr_versao = :nrVersao

SPU.RELATORIO.STATUS=\
UPDATE relatorio_fotografico SET cd_status = :cdStatus, nr_versao = nr_versao + 1, dh_alteracao = now() \
WHERE id_relatorio = :id AND nr_versao = :nrVersao

SPD.RELATORIO.DELETAR=\
DELETE FROM relatorio_fotografico WHERE id_relatorio = :id AND nr_versao = :nrVersao

SPI.RELATORIO.ITEM.INSERIR=\
INSERT INTO relatorio_fotografico_item (id_relatorio, nr_ordem, nm_item, tx_orientacao, tx_resposta) \
VALUES (:idRelatorio, :nrOrdem, :nmItem, :txOrientacao, :txResposta) RETURNING id_relatorio_item

SPU.RELATORIO.ITEM.ALTERAR=\
UPDATE relatorio_fotografico_item SET nr_ordem = :nrOrdem, nm_item = :nmItem, tx_orientacao = :txOrientacao, tx_resposta = :txResposta \
WHERE id_relatorio_item = :id AND id_relatorio = :idRelatorio

SPD.RELATORIO.ITEM.DELETAR=\
DELETE FROM relatorio_fotografico_item WHERE id_relatorio_item = :id AND id_relatorio = :idRelatorio

SPI.RELATORIO.FOTO.INSERIR=\
INSERT INTO relatorio_foto (id_relatorio_item, id_arquivo, nr_ordem, tx_legenda) \
VALUES (:idItem, :idArquivo, COALESCE((SELECT MAX(nr_ordem) + 1 FROM relatorio_foto WHERE id_relatorio_item = :idItem), 1), :txLegenda) \
RETURNING id_foto

SPU.RELATORIO.FOTO.ALTERAR=\
UPDATE relatorio_foto SET tx_legenda = :txLegenda, nr_ordem = :nrOrdem WHERE id_foto = :id

SPD.RELATORIO.FOTO.DELETAR=\
DELETE FROM relatorio_foto WHERE id_foto = :id

## Imagens do modelo (fundo/ícone). :coluna é escolhida no código entre id_arquivo_fundo e id_arquivo_icone.
SPU.RELATORIO.MODELO.FUNDO=\
UPDATE relatorio_modelo SET id_arquivo_fundo = :idArquivo, dh_alteracao = now() WHERE id_modelo = :id

SPU.RELATORIO.MODELO.ICONE=\
UPDATE relatorio_modelo SET id_arquivo_icone = :idArquivo, dh_alteracao = now() WHERE id_modelo = :id

## Troca a imagem da foto (cortar/girar): novo arquivo, mesma foto (legenda e ordem ficam).
SPU.RELATORIO.FOTO.IMAGEM=\
UPDATE relatorio_foto SET id_arquivo = :idArquivo WHERE id_foto = :id
