## Cadastro pelo próprio usuário e redefinição de senha.
SPS.CADASTRO.OBRA_POR_CODIGO=\
SELECT id_obra AS id, nm_obra AS nmObra, cd_acesso AS cdAcesso, in_ativo AS inAtivo, nr_versao AS nrVersao \
FROM obra WHERE UPPER(cd_acesso) = UPPER(:cd) AND in_ativo = TRUE

SPS.CADASTRO.EMAIL_EXISTE=\
SELECT COUNT(*) FROM usuario WHERE LOWER(nm_email) = LOWER(:email)

## Todo cadastro novo nasce PENDENTE, no perfil USER e sem nenhuma permissão.
SPI.CADASTRO.USUARIO=\
INSERT INTO usuario (nm_email, nm_nome, nm_senha_hash, id_perfil, nm_celular, id_obra_solicitada, cd_situacao_cadastro) \
SELECT :email, :nome, :hash, p.id_perfil, :celular, :idObra, 'PENDENTE' FROM perfil p WHERE p.cd_perfil = 'USER' \
RETURNING id_usuario

SPI.CADASTRO.TOKEN=\
INSERT INTO senha_redefinicao (id_usuario, nm_token_hash, dh_expira) VALUES (:idUsuario, :hash, :expira)

SPS.CADASTRO.TOKEN=\
SELECT id_senha_redefinicao AS id, id_usuario AS idUsuario, dh_expira AS expira, dh_uso AS uso \
FROM senha_redefinicao WHERE nm_token_hash = :hash

SPU.CADASTRO.USAR_TOKEN=\
UPDATE senha_redefinicao SET dh_uso = NOW() WHERE id_senha_redefinicao = :id AND dh_uso IS NULL

SPU.CADASTRO.INVALIDAR_TOKENS=\
UPDATE senha_redefinicao SET dh_uso = NOW() WHERE id_usuario = :idUsuario AND dh_uso IS NULL
