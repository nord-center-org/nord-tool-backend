SPS.CONTROLE_CHAVES.LISTAR_OBRAS=\
SELECT \
    nm_apartamento_vistoria AS nmApartamentoVistoria \
FROM apartamento_vistoria

SPS.CONTROLE_CHAVES.LISTAR_APARTAMENTOS=\
SELECT \
    id_apartamento_vistoria AS id, \
    nm_apartamento_vistoria AS nmApartamentoVistoria \
FROM apartamento_vistoria \
ORDER BY nm_apartamento_vistoria

SPS.CONTROLE_CHAVES.LISTAR_FERRAMENTAS=\
SELECT \
    id_ferramenta AS id, \
    nm_ferramenta AS nmFerramenta, \
    nm_ferramenta_categoria AS nmFerramentaCategoria, \
    cd_ferramenta_patrimonio AS cdFerramentaPatrimonio, \
    in_ferramenta_ativo AS inFerramentaAtivo \
FROM ferramentas \
WHERE in_ferramenta_ativo = true \
ORDER BY nm_ferramenta

SPS.CONTROLE_CHAVES.COUNT_EM_CAMPO=\
SELECT COUNT(*) FROM requisicoes_chaves WHERE nm_status_requisicao = 'ABERTO'

SPS.CONTROLE_CHAVES.COUNT_NO_QUADRO=\
SELECT ( \
    (SELECT COUNT(*) FROM apartamento_vistoria av \
     WHERE NOT EXISTS ( \
        SELECT 1 FROM requisicoes_chaves rc \
        WHERE rc.id_apartamento_vistoria = av.id_apartamento_vistoria \
          AND rc.nm_status_requisicao = 'ABERTO' \
     )) \
    + \
    (SELECT COUNT(*) FROM ferramentas f \
     WHERE f.in_ferramenta_ativo = true \
       AND NOT EXISTS ( \
        SELECT 1 FROM requisicoes_chaves rc \
        WHERE rc.id_ferramenta = f.id_ferramenta \
          AND rc.nm_status_requisicao = 'ABERTO' \
     )) \
)

SPS.CONTROLE_CHAVES.COUNT_ENTREGUES=\
SELECT COUNT(*) FROM requisicoes_chaves WHERE nm_status_requisicao = 'RECEBIDO'

SPS.CONTROLE_CHAVES.LISTAR_HISTORICO=\
SELECT \
    rc.id_requisicao AS idRequisicao, \
    rc.cd_retirada AS cdRetirada, \
    rc.dt_retirada AS dtRetirada, \
    rc.dt_recebimento AS dtRecebimento, \
    rc.nm_status_requisicao AS nmStatusRequisicao, \
    rc.cd_tipo_item_requisicao AS cdTipoItemRequisicao, \
    rc.id_apartamento_vistoria AS idApartamentoVistoria, \
    av.nm_apartamento_vistoria AS nmApartamentoVistoria, \
    rc.id_ferramenta AS idFerramenta, \
    fe.nm_ferramenta AS nmFerramenta, \
    rc.id_usuario_retirada AS idUserRetirada, \
    COALESCE(nur.nm_nome, ur.nm_user) AS nmPessoaRetirante, \
    COALESCE(cur.nm_cargo, pr.nm_permissao) AS nmPermissaoRetirante, \
    rc.id_usuario_liberacao AS idUserLiberacao, \
    COALESCE(nul.nm_nome, ul.nm_user) AS nmPessoaLiberador, \
    COALESCE(cul.nm_cargo, pl.nm_permissao) AS nmPermissaoLiberador, \
    rc.id_usuario_recebimento AS idUserRecebimento, \
    COALESCE(nrec.nm_nome, rec.nm_user) AS nmPessoaRecebedor, \
    COALESCE(crec.nm_cargo, prec.nm_permissao) AS nmPermissaoRecebedor, \
    (rc.id_usuario_recebimento IS NOT NULL OR rc.id_user_recebimento IS NOT NULL) AS inRecebedor \
FROM requisicoes_chaves rc \
LEFT JOIN apartamento_vistoria av ON rc.id_apartamento_vistoria = av.id_apartamento_vistoria \
LEFT JOIN ferramentas fe ON rc.id_ferramenta = fe.id_ferramenta \
LEFT JOIN usuario nur ON rc.id_usuario_retirada = nur.id_usuario \
LEFT JOIN cargos cur ON nur.id_cargo = cur.id_cargo \
LEFT JOIN users ur ON rc.id_user_retirada = ur.id_user \
LEFT JOIN permissoes pr ON ur.id_permissao = pr.id_permissao \
LEFT JOIN usuario nul ON rc.id_usuario_liberacao = nul.id_usuario \
LEFT JOIN cargos cul ON nul.id_cargo = cul.id_cargo \
LEFT JOIN users ul ON rc.id_user_liberacao = ul.id_user \
LEFT JOIN permissoes pl ON ul.id_permissao = pl.id_permissao \
LEFT JOIN usuario nrec ON rc.id_usuario_recebimento = nrec.id_usuario \
LEFT JOIN cargos crec ON nrec.id_cargo = crec.id_cargo \
LEFT JOIN users rec ON rc.id_user_recebimento = rec.id_user \
LEFT JOIN permissoes prec ON rec.id_permissao = prec.id_permissao \
ORDER BY rc.dt_retirada DESC

SPI.CONTROLE_CHAVES.INSERIR=\
INSERT INTO requisicoes_chaves ( \
    cd_retirada, \
    dt_retirada, \
    id_apartamento_vistoria, \
    id_ferramenta, \
    cd_tipo_item_requisicao, \
    id_usuario_retirada, \
    id_usuario_liberacao, \
    nm_status_requisicao \
) VALUES ( \
    :cdRetirada, \
    :dtRetirada, \
    :idApartamentoVistoria, \
    :idFerramenta, \
    :cdTipoItemRequisicao, \
    :idUserRetirada, \
    :idUserLiberacao, \
    :nmStatusRequisicao \
)

SPU.CONTROLE_CHAVES.RECEBER=\
UPDATE requisicoes_chaves \
SET dt_recebimento = :dtRecebimento, \
    id_usuario_recebimento = :idUserRecebimento, \
    nm_status_requisicao = :nmStatusRequisicao \
WHERE id_requisicao = :idRequisicao \
  AND nm_status_requisicao = 'ABERTO' \
  AND dt_recebimento IS NULL \
  AND id_user_recebimento IS NULL \
  AND id_usuario_recebimento IS NULL

SPS.CONTROLE_CHAVES.BUSCAR_POR_ID=\
SELECT \
    rc.id_requisicao AS idRequisicao, \
    rc.cd_retirada AS cdRetirada, \
    rc.dt_retirada AS dtRetirada, \
    rc.dt_recebimento AS dtRecebimento, \
    rc.nm_status_requisicao AS nmStatusRequisicao, \
    rc.cd_tipo_item_requisicao AS cdTipoItemRequisicao, \
    rc.id_apartamento_vistoria AS idApartamentoVistoria, \
    av.nm_apartamento_vistoria AS nmApartamentoVistoria, \
    rc.id_ferramenta AS idFerramenta, \
    fe.nm_ferramenta AS nmFerramenta, \
    rc.id_usuario_retirada AS idUserRetirada, \
    COALESCE(nur.nm_nome, ur.nm_user) AS nmPessoaRetirante, \
    COALESCE(cur.nm_cargo, pr.nm_permissao) AS nmPermissaoRetirante, \
    rc.id_usuario_liberacao AS idUserLiberacao, \
    COALESCE(nul.nm_nome, ul.nm_user) AS nmPessoaLiberador, \
    COALESCE(cul.nm_cargo, pl.nm_permissao) AS nmPermissaoLiberador, \
    rc.id_usuario_recebimento AS idUserRecebimento, \
    COALESCE(nrec.nm_nome, rec.nm_user) AS nmPessoaRecebedor, \
    COALESCE(crec.nm_cargo, prec.nm_permissao) AS nmPermissaoRecebedor, \
    (rc.id_usuario_recebimento IS NOT NULL OR rc.id_user_recebimento IS NOT NULL) AS inRecebedor \
FROM requisicoes_chaves rc \
LEFT JOIN apartamento_vistoria av ON rc.id_apartamento_vistoria = av.id_apartamento_vistoria \
LEFT JOIN ferramentas fe ON rc.id_ferramenta = fe.id_ferramenta \
LEFT JOIN usuario nur ON rc.id_usuario_retirada = nur.id_usuario \
LEFT JOIN cargos cur ON nur.id_cargo = cur.id_cargo \
LEFT JOIN users ur ON rc.id_user_retirada = ur.id_user \
LEFT JOIN permissoes pr ON ur.id_permissao = pr.id_permissao \
LEFT JOIN usuario nul ON rc.id_usuario_liberacao = nul.id_usuario \
LEFT JOIN cargos cul ON nul.id_cargo = cul.id_cargo \
LEFT JOIN users ul ON rc.id_user_liberacao = ul.id_user \
LEFT JOIN permissoes pl ON ul.id_permissao = pl.id_permissao \
LEFT JOIN usuario nrec ON rc.id_usuario_recebimento = nrec.id_usuario \
LEFT JOIN cargos crec ON nrec.id_cargo = crec.id_cargo \
LEFT JOIN users rec ON rc.id_user_recebimento = rec.id_user \
LEFT JOIN permissoes prec ON rec.id_permissao = prec.id_permissao \
WHERE rc.id_requisicao = :idRequisicao

## Pessoas que podem retirar chave ou ferramenta: usuários ativos (base única).
SPS.CONTROLE_CHAVES.LISTAR_PESSOAS=\
SELECT u.id_usuario AS id, u.nm_nome AS nmNome, c.nm_cargo AS nmCargo, e.nm_empresa AS nmEmpresa \
FROM usuario u \
LEFT JOIN cargos c ON c.id_cargo = u.id_cargo \
LEFT JOIN empresas e ON e.id_empresa = u.id_empresa \
WHERE u.in_ativo = TRUE \
ORDER BY LOWER(u.nm_nome)

SPS.CONTROLE_CHAVES.USUARIO_ATIVO=\
SELECT COUNT(*) FROM usuario WHERE id_usuario = :id AND in_ativo = TRUE
