SPS.CONTROLE_CHAVES.LISTAR_OBRAS=\
SELECT \
    nm_apartamento_vistoria AS nmApartamentoVistoria \
FROM apartamento_vistoria

SPS.CONTROLE_CHAVES.LISTAR_APARTAMENTOS=\
SELECT \
    id_apartamento_vistoria AS id, \
    nm_apartamento_vistoria AS nmApartamentoVistoria \
FROM apartamento_vistoria \
ORDER BY nm_apartamento_vistoria

SPS.CONTROLE_CHAVES.COUNT_EM_CAMPO=\
SELECT COUNT(*) FROM requisicoes_chaves WHERE nm_status_requisicao = 'ABERTO'

SPS.CONTROLE_CHAVES.COUNT_NO_QUADRO=\
SELECT COUNT(*) FROM apartamento_vistoria av \
WHERE NOT EXISTS ( \
    SELECT 1 FROM requisicoes_chaves rc \
    WHERE rc.id_apartamento_vistoria = av.id_apartamento_vistoria \
      AND rc.nm_status_requisicao = 'ABERTO' \
)

SPS.CONTROLE_CHAVES.COUNT_ENTREGUES=\
SELECT COUNT(*) FROM requisicoes_chaves WHERE nm_status_requisicao = 'RECEBIDO'

SPS.CONTROLE_CHAVES.LISTAR_HISTORICO=\
SELECT \
    rc.id_requisicao AS idRequisicao, \
    rc.cd_retirada AS cdRetirada, \
    rc.dt_retirada AS dtRetirada, \
    rc.dt_recebimento AS dtRecebimento, \
    rc.nm_status_requisicao AS nmStatusRequisicao, \
    rc.id_apartamento_vistoria AS idApartamentoVistoria, \
    av.nm_apartamento_vistoria AS nmApartamentoVistoria, \
    rc.id_user_retirada AS idUserRetirada, \
    ur.nm_user AS nmPessoaRetirante, \
    pr.nm_permissao AS nmPermissaoRetirante, \
    rc.id_user_liberacao AS idUserLiberacao, \
    ul.nm_user AS nmPessoaLiberador, \
    pl.nm_permissao AS nmPermissaoLiberador, \
    rc.id_user_recebimento AS idUserRecebimento, \
    rec.nm_user AS nmPessoaRecebedor, \
    prec.nm_permissao AS nmPermissaoRecebedor \
FROM requisicoes_chaves rc \
INNER JOIN apartamento_vistoria av ON rc.id_apartamento_vistoria = av.id_apartamento_vistoria \
INNER JOIN users ur ON rc.id_user_retirada = ur.id_user \
LEFT JOIN permissoes pr ON ur.id_permissao = pr.id_permissao \
INNER JOIN users ul ON rc.id_user_liberacao = ul.id_user \
LEFT JOIN permissoes pl ON ul.id_permissao = pl.id_permissao \
LEFT JOIN users rec ON rc.id_user_recebimento = rec.id_user \
LEFT JOIN permissoes prec ON rec.id_permissao = prec.id_permissao \
ORDER BY rc.dt_retirada DESC

SPI.CONTROLE_CHAVES.INSERIR=\
INSERT INTO requisicoes_chaves ( \
    cd_retirada, \
    dt_retirada, \
    id_apartamento_vistoria, \
    id_user_retirada, \
    id_user_liberacao, \
    nm_status_requisicao \
) VALUES ( \
    :cdRetirada, \
    :dtRetirada, \
    :idApartamentoVistoria, \
    :idUserRetirada, \
    :idUserLiberacao, \
    :nmStatusRequisicao \
)

SPU.CONTROLE_CHAVES.RECEBER=\
UPDATE requisicoes_chaves \
SET dt_recebimento = :dtRecebimento, \
    id_user_recebimento = :idUserRecebimento, \
    nm_status_requisicao = :nmStatusRequisicao \
WHERE id_requisicao = :idRequisicao \
  AND nm_status_requisicao = 'ABERTO' \
  AND dt_recebimento IS NULL \
  AND id_user_recebimento IS NULL

SPS.CONTROLE_CHAVES.BUSCAR_POR_ID=\
SELECT \
    rc.id_requisicao AS idRequisicao, \
    rc.cd_retirada AS cdRetirada, \
    rc.dt_retirada AS dtRetirada, \
    rc.dt_recebimento AS dtRecebimento, \
    rc.nm_status_requisicao AS nmStatusRequisicao, \
    rc.id_apartamento_vistoria AS idApartamentoVistoria, \
    av.nm_apartamento_vistoria AS nmApartamentoVistoria, \
    rc.id_user_retirada AS idUserRetirada, \
    ur.nm_user AS nmPessoaRetirante, \
    pr.nm_permissao AS nmPermissaoRetirante, \
    rc.id_user_liberacao AS idUserLiberacao, \
    ul.nm_user AS nmPessoaLiberador, \
    pl.nm_permissao AS nmPermissaoLiberador, \
    rc.id_user_recebimento AS idUserRecebimento, \
    rec.nm_user AS nmPessoaRecebedor, \
    prec.nm_permissao AS nmPermissaoRecebedor \
FROM requisicoes_chaves rc \
INNER JOIN apartamento_vistoria av ON rc.id_apartamento_vistoria = av.id_apartamento_vistoria \
INNER JOIN users ur ON rc.id_user_retirada = ur.id_user \
LEFT JOIN permissoes pr ON ur.id_permissao = pr.id_permissao \
INNER JOIN users ul ON rc.id_user_liberacao = ul.id_user \
LEFT JOIN permissoes pl ON ul.id_permissao = pl.id_permissao \
LEFT JOIN users rec ON rc.id_user_recebimento = rec.id_user \
LEFT JOIN permissoes prec ON rec.id_permissao = prec.id_permissao \
WHERE rc.id_requisicao = :idRequisicao
