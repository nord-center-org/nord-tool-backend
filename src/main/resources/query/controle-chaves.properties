SPS.CONTROLE_CHAVES.LISTAR_OBRAS=SELECT DISTINCT regexp_replace(nm_apartamento_vistoria, '[-_ ]?[0-9].*$', '') AS id_obra FROM apartamento_vistoria WHERE nm_apartamento_vistoria IS NOT NULL AND nm_apartamento_vistoria != '' ORDER BY id_obra
SPS.CONTROLE_CHAVES.LISTAR_APARTAMENTOS=SELECT id_apartamento_vistoria AS id, nm_apartamento_vistoria AS label FROM apartamento_vistoria WHERE (:busca IS NULL OR :busca = '' OR LOWER(nm_apartamento_vistoria) LIKE LOWER(CONCAT('%', :busca, '%'))) ORDER BY nm_apartamento_vistoria LIMIT :limite OFFSET :offset
SPS.CONTROLE_CHAVES.COUNT_EM_CAMPO=SELECT COUNT(*) FROM requisicoes_de_chaves WHERE st_requisicao = 'ABERTO'
SPS.CONTROLE_CHAVES.COUNT_NO_QUADRO=SELECT COUNT(*) FROM apartamento_vistoria av WHERE NOT EXISTS (SELECT 1 FROM requisicoes_de_chaves rc WHERE rc.id_apartamento_vistoria = av.id_apartamento_vistoria AND rc.st_requisicao = 'ABERTO')
SPS.CONTROLE_CHAVES.COUNT_ENTREGUES=SELECT COUNT(*) FROM requisicoes_de_chaves WHERE st_requisicao = 'RECEBIDO'
SPS.CONTROLE_CHAVES.LISTAR_HISTORICO=SELECT rc.id_requisicao AS id, rc.cd_retirada AS cdRetirada, rc.dt_retirada AS dtRetirada, rc.dt_recebimento AS dtRecebimento, rc.st_requisicao AS stRequisicao, rc.id_apartamento_vistoria AS idApartamentoVistoria, av.nm_apartamento_vistoria AS nmApartamentoVistoria, rc.id_user_retirada AS idUserRetirada, ur.nm_user AS nmUserRetirada, pr.nm_permissao AS nmPermissaoRetirante, rc.id_user_liberacao AS idUserLiberacao, ul.nm_user AS nmUserLiberacao, pl.nm_permissao AS nmPermissaoLiberador, rc.id_user_recebimento AS idUserRecebimento, rec.nm_user AS nmUserRecebimento, prec.nm_permissao AS nmPermissaoRecebedor FROM requisicoes_de_chaves rc INNER JOIN apartamento_vistoria av ON rc.id_apartamento_vistoria = av.id_apartamento_vistoria INNER JOIN users ur ON rc.id_user_retirada = ur.id_user LEFT JOIN permissoes pr ON ur.id_permissao = pr.id_permissao INNER JOIN users ul ON rc.id_user_liberacao = ul.id_user LEFT JOIN permissoes pl ON ul.id_permissao = pl.id_permissao LEFT JOIN users rec ON rc.id_user_recebimento = rec.id_user LEFT JOIN permissoes prec ON rec.id_permissao = prec.id_permissao WHERE (:busca IS NULL OR :busca = '' OR LOWER(av.nm_apartamento_vistoria) LIKE LOWER(CONCAT('%', :busca, '%')) OR LOWER(ur.nm_user) LIKE LOWER(CONCAT('%', :busca, '%')) OR LOWER(rc.cd_retirada) LIKE LOWER(CONCAT('%', :busca, '%'))) AND (:status IS NULL OR :status = '' OR LOWER(rc.st_requisicao) = LOWER(:status)) AND (:idObra IS NULL OR :idObra = '' OR LOWER(av.nm_apartamento_vistoria) LIKE LOWER(CONCAT(:idObra, '%'))) ORDER BY rc.dt_retirada DESC LIMIT :limite OFFSET :offset
SPI.CONTROLE_CHAVES.INSERIR=INSERT INTO requisicoes_de_chaves (cd_retirada, dt_retirada, id_apartamento_vistoria, id_user_retirada, id_user_liberacao, st_requisicao) VALUES (:cdRetirada, :dtRetirada, :idApartamentoVistoria, :idUserRetirada, :idUserLiberacao, 'ABERTO')
SPU.CONTROLE_CHAVES.RECEBER=UPDATE requisicoes_de_chaves SET dt_recebimento = :dtRecebimento, id_user_recebimento = :idUserRecebimento, st_requisicao = 'RECEBIDO' WHERE id_requisicao = :id
SPS.CONTROLE_CHAVES.BUSCAR_POR_ID=SELECT rc.id_requisicao AS id, rc.cd_retirada AS cdRetirada, rc.dt_retirada AS dtRetirada, rc.dt_recebimento AS dtRecebimento, rc.st_requisicao AS stRequisicao, rc.id_apartamento_vistoria AS idApartamentoVistoria, av.nm_apartamento_vistoria AS nmApartamentoVistoria, rc.id_user_retirada AS idUserRetirada, ur.nm_user AS nmUserRetirada, pr.nm_permissao AS nmPermissaoRetirante, rc.id_user_liberacao AS idUserLiberacao, ul.nm_user AS nmUserLiberacao, pl.nm_permissao AS nmPermissaoLiberador, rc.id_user_recebimento AS idUserRecebimento, rec.nm_user AS nmUserRecebimento, prec.nm_permissao AS nmPermissaoRecebedor FROM requisicoes_de_chaves rc INNER JOIN apartamento_vistoria av ON rc.id_apartamento_vistoria = av.id_apartamento_vistoria INNER JOIN users ur ON rc.id_user_retirada = ur.id_user LEFT JOIN permissoes pr ON ur.id_permissao = pr.id_permissao INNER JOIN users ul ON rc.id_user_liberacao = ul.id_user LEFT JOIN permissoes pl ON ul.id_permissao = pl.id_permissao LEFT JOIN users rec ON rc.id_user_recebimento = rec.id_user LEFT JOIN permissoes prec ON rec.id_permissao = prec.id_permissao WHERE rc.id_requisicao = :id
