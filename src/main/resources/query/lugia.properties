## Lugia (chat multi-IA). Conversas são sempre filtradas pelo usuário dono.

SPS.LUGIA.CONVERSAS=\
SELECT id_conversa AS id, ds_titulo AS titulo, dh_atualizacao AS atualizadaEm, tx_sessao_agente AS sessaoAgente \
FROM lugia_conversa WHERE id_usuario = :idUsuario \
  AND (CAST(:id AS bigint) IS NULL OR id_conversa = :id) \
ORDER BY dh_atualizacao DESC LIMIT 200

SPI.LUGIA.CONVERSA=\
INSERT INTO lugia_conversa (id_usuario, ds_titulo) VALUES (:idUsuario, :titulo) RETURNING id_conversa

SPU.LUGIA.CONVERSA.TITULO=\
UPDATE lugia_conversa SET ds_titulo = :titulo WHERE id_conversa = :id AND id_usuario = :idUsuario

SPU.LUGIA.CONVERSA.SESSAO=\
UPDATE lugia_conversa SET tx_sessao_agente = :sessao WHERE id_conversa = :id

SPU.LUGIA.CONVERSA.TOCAR=\
UPDATE lugia_conversa SET dh_atualizacao = now() WHERE id_conversa = :id

SPD.LUGIA.CONVERSA=\
DELETE FROM lugia_conversa WHERE id_conversa = :id AND id_usuario = :idUsuario

SPS.LUGIA.MENSAGENS=\
SELECT cd_papel AS papel, cd_provedor AS provedor, CAST(tx_partes AS text) AS partes, CAST(tx_conteudo_nativo AS text) AS nativo \
FROM lugia_mensagem WHERE id_conversa = :idConversa ORDER BY id_mensagem

SPI.LUGIA.MENSAGEM=\
INSERT INTO lugia_mensagem (id_conversa, cd_papel, cd_provedor, cd_modelo, tx_partes, tx_conteudo_nativo, qt_tokens_entrada, qt_tokens_saida) \
VALUES (:idConversa, :papel, :provedor, :modelo, CAST(:partes AS jsonb), CAST(:nativo AS jsonb), :tokensEntrada, :tokensSaida)

SPS.LUGIA.CONFIGURACAO=\
SELECT tx_valor FROM lugia_configuracao WHERE cd_chave = :chave

SPI.LUGIA.CONFIGURACAO=\
INSERT INTO lugia_configuracao (cd_chave, tx_valor) VALUES (:chave, :valor) \
ON CONFLICT (cd_chave) DO UPDATE SET tx_valor = EXCLUDED.tx_valor, dh_atualizacao = now()
