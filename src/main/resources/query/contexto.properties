## Contexto de obra e fase de cada requisição.
SPS.CONTEXTO.EXISTE_FASE=\
SELECT EXISTS (SELECT 1 FROM fase)

SPS.CONTEXTO.FASES=\
SELECT f.id_fase AS id, f.id_obra AS idObra, f.nm_fase AS nmFase, f.cd_fase AS cdFase, f.nr_ordem AS nrOrdem, \
f.in_ativo AS inAtivo, f.nr_versao AS nrVersao \
FROM fase f JOIN obra o ON o.id_obra = f.id_obra \
WHERE f.in_ativo = TRUE AND o.in_ativo = TRUE AND (CAST(:idObra AS BIGINT) IS NULL OR f.id_obra = :idObra) \
ORDER BY f.id_obra, f.nr_ordem, LOWER(f.nm_fase)

SPS.CONTEXTO.FASES_USUARIO=\
SELECT f.id_fase AS id, f.id_obra AS idObra, f.nm_fase AS nmFase, f.cd_fase AS cdFase, f.nr_ordem AS nrOrdem, \
f.in_ativo AS inAtivo, f.nr_versao AS nrVersao \
FROM usuario_fase uf JOIN fase f ON f.id_fase = uf.id_fase JOIN obra o ON o.id_obra = f.id_obra \
WHERE uf.id_usuario = :idUsuario AND f.in_ativo = TRUE AND o.in_ativo = TRUE \
AND (CAST(:idObra AS BIGINT) IS NULL OR f.id_obra = :idObra) \
ORDER BY f.id_obra, f.nr_ordem, LOWER(f.nm_fase)

SPS.CONTEXTO.OBRAS=\
SELECT id_obra AS id, nm_obra AS nmObra, cd_acesso AS cdAcesso, in_ativo AS inAtivo, nr_versao AS nrVersao \
FROM obra WHERE in_ativo = TRUE ORDER BY LOWER(nm_obra)
