## Davi Job (easter egg): placar do minigame "Caça ao rato".

SPI.DAVI_JOB.PONTUACAO=\
INSERT INTO davi_job_pontuacao (id_usuario, nr_pontos) VALUES (:idUsuario, :nrPontos)

## Melhor pontuação de cada pessoa (empate: quem fez primeiro). A posição é calculada sobre todos;
## :somenteUsuario filtra depois, para o recorde do usuário vir com a posição real dele.
SPS.DAVI_JOB.RANKING=\
WITH melhores AS ( \
    SELECT DISTINCT ON (p.id_usuario) p.id_usuario, p.nr_pontos, p.dh_criacao \
    FROM davi_job_pontuacao p JOIN usuario u ON u.id_usuario = p.id_usuario \
    WHERE u.in_ativo = TRUE \
    ORDER BY p.id_usuario, p.nr_pontos DESC, p.dh_criacao \
), posicoes AS ( \
    SELECT m.*, ROW_NUMBER() OVER (ORDER BY m.nr_pontos DESC, m.dh_criacao) AS posicao FROM melhores m \
) \
SELECT CAST(ps.posicao AS INTEGER) AS nrPosicao, ps.id_usuario AS idUsuario, u.nm_nome AS nmNome, ps.nr_pontos AS nrPontos, \
ps.dh_criacao AS dhCriacao, (ps.id_usuario = :idUsuario) AS flProprio \
FROM posicoes ps JOIN usuario u ON u.id_usuario = ps.id_usuario \
WHERE (CAST(:somenteUsuario AS bigint) IS NULL OR ps.id_usuario = :somenteUsuario) \
ORDER BY ps.posicao \
LIMIT :limite
