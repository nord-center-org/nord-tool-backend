## Cubicagem (Mapeamentos): peças de concreto de um projeto em JSON. Tudo filtra pelo dono.

SPS.CUBICAGENS=\
SELECT id_cubicagem AS id, nm_titulo AS nmTitulo, nr_perda AS nrPerda, nr_versao AS nrVersao, \
dh_criacao AS dhCriacao, dh_alteracao AS dhAlteracao, \
CASE WHEN tx_pecas LIKE '[%' THEN json_array_length(tx_pecas::json) ELSE 0 END AS qtPecas \
FROM cubicagem WHERE id_usuario = :idUsuario \
ORDER BY dh_alteracao DESC, id_cubicagem DESC

SPS.CUBICAGENS.CONTAR=\
SELECT COUNT(*) FROM cubicagem WHERE id_usuario = :idUsuario

SPS.CUBICAGEM=\
SELECT id_cubicagem AS id, nm_titulo AS nmTitulo, nr_perda AS nrPerda, nr_versao AS nrVersao, \
dh_criacao AS dhCriacao, dh_alteracao AS dhAlteracao, tx_pecas AS txPecas \
FROM cubicagem WHERE id_cubicagem = :id AND id_usuario = :idUsuario

SPI.CUBICAGEM=\
INSERT INTO cubicagem (id_usuario, nm_titulo, nr_perda, tx_pecas) VALUES (:idUsuario, :titulo, :perda, :pecas) \
RETURNING id_cubicagem

SPU.CUBICAGEM=\
UPDATE cubicagem SET nm_titulo = :titulo, nr_perda = :perda, tx_pecas = :pecas, nr_versao = nr_versao + 1, dh_alteracao = NOW() \
WHERE id_cubicagem = :id AND id_usuario = :idUsuario AND nr_versao = :nrVersao

SPD.CUBICAGEM=\
DELETE FROM cubicagem WHERE id_cubicagem = :id AND id_usuario = :idUsuario
