## Medições de contratos.
SPS.MEDICAO.LISTAR=\
SELECT m.id_medicao AS id, m.nr_medicao AS nrMedicao, m.cd_contrato AS cdContrato, m.nm_razao_social AS nmRazaoSocial, \
m.nr_contrato AS nrContrato, m.dt_medicao AS dtMedicao, m.vl_medicao AS vlMedicao, m.tx_memorial AS txMemorial, \
m.cd_status AS cdStatus, s.nm_status AS nmStatus, m.nr_versao AS nrVersao, m.dh_alteracao AS dhAlteracao, m.id_fase AS idFase \
FROM medicao m JOIN medicao_status s ON s.cd_status = m.cd_status \
WHERE (:todasFases OR m.id_fase = ANY(CAST(string_to_array(:fasesCsv, ',') AS bigint[])) OR (:verSemFase AND m.id_fase IS NULL)) \
ORDER BY m.dt_medicao DESC, m.id_medicao DESC

SPS.MEDICAO.BUSCAR=\
SELECT m.id_medicao AS id, m.nr_medicao AS nrMedicao, m.cd_contrato AS cdContrato, m.nm_razao_social AS nmRazaoSocial, \
m.nr_contrato AS nrContrato, m.dt_medicao AS dtMedicao, m.vl_medicao AS vlMedicao, m.tx_memorial AS txMemorial, \
m.cd_status AS cdStatus, s.nm_status AS nmStatus, m.nr_versao AS nrVersao, m.dh_alteracao AS dhAlteracao, m.id_fase AS idFase \
FROM medicao m JOIN medicao_status s ON s.cd_status = m.cd_status \
WHERE m.id_medicao = :id AND (:todasFases OR m.id_fase = ANY(CAST(string_to_array(:fasesCsv, ',') AS bigint[])) OR (:verSemFase AND m.id_fase IS NULL))

SPI.MEDICAO.INSERIR=\
INSERT INTO medicao (nr_medicao, cd_contrato, nm_razao_social, nr_contrato, dt_medicao, vl_medicao, tx_memorial, cd_status, id_fase) \
VALUES (:nrMedicao, :cdContrato, :nmRazaoSocial, :nrContrato, :dtMedicao, :vlMedicao, :txMemorial, :cdStatus, :idFase) \
RETURNING id_medicao

## Só altera se a versão ainda for a que o cliente viu; devolve o nº de linhas (0 = conflito ou inexistente).
SPU.MEDICAO.ALTERAR=\
UPDATE medicao SET nr_medicao = :nrMedicao, cd_contrato = :cdContrato, nm_razao_social = :nmRazaoSocial, \
nr_contrato = :nrContrato, dt_medicao = :dtMedicao, vl_medicao = :vlMedicao, tx_memorial = :txMemorial, \
cd_status = :cdStatus, nr_versao = nr_versao + 1, dh_alteracao = now() \
WHERE id_medicao = :id AND nr_versao = :nrVersao AND (:todasFases OR medicao.id_fase = ANY(CAST(string_to_array(:fasesCsv, ',') AS bigint[])) OR (:verSemFase AND medicao.id_fase IS NULL))

SPU.MEDICAO.STATUS=\
UPDATE medicao SET cd_status = :cdStatus, nr_versao = nr_versao + 1, dh_alteracao = now() \
WHERE id_medicao = :id AND nr_versao = :nrVersao AND (:todasFases OR medicao.id_fase = ANY(CAST(string_to_array(:fasesCsv, ',') AS bigint[])) OR (:verSemFase AND medicao.id_fase IS NULL))

SPD.MEDICAO.DELETAR=\
DELETE FROM medicao WHERE id_medicao = :id AND nr_versao = :nrVersao AND (:todasFases OR medicao.id_fase = ANY(CAST(string_to_array(:fasesCsv, ',') AS bigint[])) OR (:verSemFase AND medicao.id_fase IS NULL))

SPS.MEDICAO.STATUS.LISTAR=\
SELECT cd_status AS cdStatus, nm_status AS nmStatus, nr_ordem AS nrOrdem, in_ativo AS inAtivo \
FROM medicao_status ORDER BY nr_ordem, nm_status
