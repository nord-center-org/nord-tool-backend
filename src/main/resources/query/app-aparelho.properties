# App Android: aparelhos que renovam a sessão sem pedir a senha (só o hash SHA-256 do token fica no banco).

SPI.APP_APARELHO.CRIAR=\
INSERT INTO app_aparelho (id_usuario, tx_token_hash, nm_aparelho, nr_versao_sessao) VALUES (:idUsuario, :hash, :aparelho, :versao)

## Válido: não revogado e usado nos últimos :dias dias.
SPS.APP_APARELHO.POR_HASH=\
SELECT id_app_aparelho AS id, id_usuario AS idUsuario, nr_versao_sessao AS nrVersaoSessao FROM app_aparelho \
WHERE tx_token_hash = :hash AND dh_revogacao IS NULL AND dh_ultimo_uso > NOW() - make_interval(days => :dias)

SPU.APP_APARELHO.USO=\
UPDATE app_aparelho SET dh_ultimo_uso = NOW() WHERE id_app_aparelho = :id

SPU.APP_APARELHO.REVOGAR=\
UPDATE app_aparelho SET dh_revogacao = NOW() WHERE tx_token_hash = :hash AND dh_revogacao IS NULL

## Mantém só os :limite mais recentes da pessoa ativos.
SPU.APP_APARELHO.EXCEDENTES=\
UPDATE app_aparelho SET dh_revogacao = NOW() WHERE id_usuario = :idUsuario AND dh_revogacao IS NULL AND id_app_aparelho NOT IN (\
SELECT id_app_aparelho FROM app_aparelho WHERE id_usuario = :idUsuario AND dh_revogacao IS NULL ORDER BY dh_ultimo_uso DESC LIMIT :limite)
