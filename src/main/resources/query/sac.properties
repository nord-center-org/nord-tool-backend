# SAC: chamados das pessoas para os administradores, com prints da tela.

SPS.SAC.LISTAR=\
SELECT c.id_chamado AS id, c.id_usuario AS idUsuario, u.nm_nome AS nmUsuario, c.nm_titulo AS nmTitulo, \
c.tx_descricao AS txDescricao, c.tx_tela AS txTela, c.cd_status AS cdStatus, c.tx_resposta AS txResposta, \
r.nm_nome AS nmUsuarioResposta, c.dh_criacao AS dhCriacao, c.dh_atualizacao AS dhAtualizacao \
FROM sac_chamado c \
JOIN usuario u ON u.id_usuario = c.id_usuario \
LEFT JOIN usuario r ON r.id_usuario = c.id_usuario_resposta \
WHERE (CAST(:idUsuario AS BIGINT) IS NULL OR c.id_usuario = :idUsuario) \
AND (CAST(:id AS BIGINT) IS NULL OR c.id_chamado = :id) \
ORDER BY c.dh_criacao DESC \
LIMIT 300

SPS.SAC.IMAGENS=\
SELECT i.id_imagem AS id, i.id_chamado AS idChamado, i.id_arquivo AS idArquivo, c.id_usuario AS idUsuario \
FROM sac_chamado_imagem i JOIN sac_chamado c ON c.id_chamado = i.id_chamado \
WHERE i.id_chamado IN (:ids) ORDER BY i.id_chamado, i.nr_ordem

SPS.SAC.IMAGEM=\
SELECT i.id_imagem AS id, i.id_chamado AS idChamado, i.id_arquivo AS idArquivo, c.id_usuario AS idUsuario \
FROM sac_chamado_imagem i JOIN sac_chamado c ON c.id_chamado = i.id_chamado \
WHERE i.id_imagem = :id

SPI.SAC.INSERIR=\
INSERT INTO sac_chamado (id_usuario, nm_titulo, tx_descricao, tx_tela) \
VALUES (:idUsuario, :nmTitulo, :txDescricao, :txTela) \
RETURNING id_chamado

SPI.SAC.IMAGEM.INSERIR=\
INSERT INTO sac_chamado_imagem (id_chamado, id_arquivo, nr_ordem) VALUES (:idChamado, :idArquivo, :nrOrdem)

SPU.SAC.RESPONDER=\
UPDATE sac_chamado SET cd_status = :cdStatus, tx_resposta = :txResposta, id_usuario_resposta = :idUsuarioResposta, \
dh_atualizacao = NOW() WHERE id_chamado = :id

SPS.SAC.ARQUIVOS=\
SELECT id_arquivo FROM sac_chamado_imagem WHERE id_chamado = :idChamado

SPD.SAC.EXCLUIR=\
DELETE FROM sac_chamado WHERE id_chamado = :id
