# Placas de obra: modelos (todas as obras) e placas (por obra).

SPS.PLACA.MODELOS=\
SELECT m.id_modelo AS id, m.nm_modelo AS nmModelo, m.tx_config AS txConfig, m.id_arquivo_fundo AS idArquivoFundo, \
m.id_arquivo_logo AS idArquivoLogo, (m.id_arquivo_fundo IS NOT NULL) AS inFundo, (m.id_arquivo_logo IS NOT NULL) AS inLogo, \
m.id_arquivo_fundo AS versaoFundo, m.id_arquivo_logo AS versaoLogo, m.in_ativo AS inAtivo, m.dh_atualizacao AS dhAtualizacao \
FROM placa_modelo m \
WHERE (CAST(:id AS BIGINT) IS NULL OR m.id_modelo = :id) \
ORDER BY m.in_ativo DESC, LOWER(m.nm_modelo)

SPI.PLACA.MODELO.INSERIR=\
INSERT INTO placa_modelo (nm_modelo, tx_config, in_ativo, id_usuario_atualizacao) VALUES (:nome, :config, :ativo, :idUsuario) \
RETURNING id_modelo

SPU.PLACA.MODELO.ALTERAR=\
UPDATE placa_modelo SET nm_modelo = :nome, tx_config = :config, in_ativo = :ativo, id_usuario_atualizacao = :idUsuario, \
nr_versao = nr_versao + 1, dh_atualizacao = NOW() WHERE id_modelo = :id

SPU.PLACA.MODELO.FUNDO=\
UPDATE placa_modelo SET id_arquivo_fundo = :idArquivo, id_usuario_atualizacao = :idUsuario, nr_versao = nr_versao + 1, dh_atualizacao = NOW() \
WHERE id_modelo = :id

SPU.PLACA.MODELO.LOGO=\
UPDATE placa_modelo SET id_arquivo_logo = :idArquivo, id_usuario_atualizacao = :idUsuario, nr_versao = nr_versao + 1, dh_atualizacao = NOW() \
WHERE id_modelo = :id

SPS.PLACA.MODELO.USO=\
SELECT COUNT(*) FROM placa WHERE id_modelo = :id

SPD.PLACA.MODELO.EXCLUIR=\
DELETE FROM placa_modelo WHERE id_modelo = :id

SPS.PLACA.LISTAR=\
SELECT p.id_placa AS id, p.id_modelo AS idModelo, p.nm_titulo AS nmTitulo, p.tx_valores AS txValores, p.id_obra AS idObra, \
u.nm_nome AS nmUsuario, p.dh_atualizacao AS dhAtualizacao \
FROM placa p LEFT JOIN usuario u ON u.id_usuario = p.id_usuario_atualizacao \
WHERE (CAST(:idObra AS BIGINT) IS NULL OR p.id_obra = :idObra) \
AND (CAST(:id AS BIGINT) IS NULL OR p.id_placa = :id) \
ORDER BY p.dh_atualizacao DESC \
LIMIT 500

SPI.PLACA.INSERIR=\
INSERT INTO placa (id_obra, id_modelo, nm_titulo, tx_valores, id_usuario_atualizacao) \
VALUES (:idObra, :idModelo, :titulo, :valores, :idUsuario) RETURNING id_placa

SPU.PLACA.ALTERAR=\
UPDATE placa SET id_modelo = :idModelo, nm_titulo = :titulo, tx_valores = :valores, id_usuario_atualizacao = :idUsuario, \
dh_atualizacao = NOW() WHERE id_placa = :id

SPD.PLACA.EXCLUIR=\
DELETE FROM placa WHERE id_placa = :id

## v2: imagens soltas na folha (o JSON do modelo/da placa aponta para id_imagem).
SPI.PLACA.IMAGEM=\
INSERT INTO placa_imagem (id_arquivo, id_usuario) VALUES (:idArquivo, :idUsuario) RETURNING id_imagem

SPS.PLACA.IMAGEM.ARQUIVO=\
SELECT id_arquivo FROM placa_imagem WHERE id_imagem = :id
