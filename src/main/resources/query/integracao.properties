## Links de integração (chaves de leitura para assistentes de IA). Só o hash da chave fica no banco.

SPS.INTEGRACAO.TOKENS=\
SELECT id_token AS idToken, id_usuario AS idUsuario, cd_escopo AS cdEscopo, nm_rotulo AS nmRotulo, tx_prefixo AS txPrefixo, \
       in_ativo AS inAtivo, dh_criacao AS dhCriacao, dh_ultimo_uso AS dhUltimoUso \
FROM integracao_token WHERE id_usuario = :idUsuario AND in_ativo = TRUE ORDER BY dh_criacao DESC

SPS.INTEGRACAO.TOKENS.CONTAR=\
SELECT COUNT(*) FROM integracao_token WHERE id_usuario = :idUsuario AND in_ativo = TRUE

SPI.INTEGRACAO.TOKEN=\
INSERT INTO integracao_token (id_usuario, cd_escopo, nm_rotulo, tx_hash, tx_prefixo) \
VALUES (:idUsuario, :escopo, :rotulo, :hash, :prefixo) RETURNING id_token

SPU.INTEGRACAO.TOKEN.REVOGAR=\
UPDATE integracao_token SET in_ativo = FALSE WHERE id_token = :id AND id_usuario = :idUsuario AND in_ativo = TRUE

SPS.INTEGRACAO.TOKEN.HASH=\
SELECT id_token AS idToken, id_usuario AS idUsuario, cd_escopo AS cdEscopo, nm_rotulo AS nmRotulo, tx_prefixo AS txPrefixo, \
       in_ativo AS inAtivo, dh_criacao AS dhCriacao, dh_ultimo_uso AS dhUltimoUso \
FROM integracao_token WHERE tx_hash = :hash AND in_ativo = TRUE

SPU.INTEGRACAO.TOKEN.USO=\
UPDATE integracao_token SET dh_ultimo_uso = now() WHERE id_token = :id
