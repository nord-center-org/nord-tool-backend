## Repertório v7: músicas e criações do estúdio na conta. Tudo filtra pelo dono.

SPS.REPERTORIO.MUSICAS=\
SELECT cd_chave AS cdChave, nm_titulo AS nmTitulo, nm_artista AS nmArtista, nm_arquivo AS nmArquivo, nr_tamanho_bytes AS nrTamanhoBytes, \
nr_duracao AS nrDuracao, nm_tom AS nmTom, nr_bpm AS nrBpm, cd_projeto AS cdProjeto, id_arquivo AS idArquivo, \
dh_criacao AS dhCriacao, dh_alteracao AS dhAlteracao \
FROM repertorio_musica WHERE id_usuario = :idUsuario ORDER BY dh_alteracao DESC, id_musica DESC

SPS.REPERTORIO.MUSICA=\
SELECT cd_chave AS cdChave, nm_titulo AS nmTitulo, nm_artista AS nmArtista, nm_arquivo AS nmArquivo, nr_tamanho_bytes AS nrTamanhoBytes, \
nr_duracao AS nrDuracao, nm_tom AS nmTom, nr_bpm AS nrBpm, cd_projeto AS cdProjeto, id_arquivo AS idArquivo, \
dh_criacao AS dhCriacao, dh_alteracao AS dhAlteracao, tx_dados AS txDados \
FROM repertorio_musica WHERE id_usuario = :idUsuario AND cd_chave = :chave

SPS.REPERTORIO.MUSICAS.CONTAR=\
SELECT COUNT(*) FROM repertorio_musica WHERE id_usuario = :idUsuario

SPS.REPERTORIO.BYTES=\
SELECT COALESCE(SUM(nr_tamanho_bytes), 0) FROM repertorio_musica \
WHERE id_usuario = :idUsuario AND id_arquivo IS NOT NULL AND (CAST(:exceto AS VARCHAR) IS NULL OR cd_chave <> :exceto)

SPI.REPERTORIO.MUSICA=\
INSERT INTO repertorio_musica (id_usuario, cd_chave, nm_titulo, nm_artista, nr_duracao, nm_tom, nr_bpm, cd_projeto, tx_dados, nm_arquivo) \
VALUES (:idUsuario, :chave, :titulo, :artista, :duracao, :tom, :bpm, :projeto, :dados, :arquivo) \
ON CONFLICT (id_usuario, cd_chave) DO UPDATE SET nm_titulo = EXCLUDED.nm_titulo, nm_artista = EXCLUDED.nm_artista, \
nr_duracao = EXCLUDED.nr_duracao, nm_tom = EXCLUDED.nm_tom, nr_bpm = EXCLUDED.nr_bpm, cd_projeto = EXCLUDED.cd_projeto, \
tx_dados = EXCLUDED.tx_dados, nm_arquivo = CASE WHEN repertorio_musica.id_arquivo IS NULL THEN EXCLUDED.nm_arquivo ELSE repertorio_musica.nm_arquivo END, \
dh_alteracao = NOW()

SPU.REPERTORIO.AUDIO=\
UPDATE repertorio_musica SET id_arquivo = :idArquivo, nm_arquivo = :nome, nr_tamanho_bytes = :tamanho, dh_alteracao = NOW() \
WHERE id_usuario = :idUsuario AND cd_chave = :chave

SPD.REPERTORIO.MUSICA=\
DELETE FROM repertorio_musica WHERE id_usuario = :idUsuario AND cd_chave = :chave

SPS.REPERTORIO.PROJETOS=\
SELECT cd_chave AS cdChave, nm_titulo AS nmTitulo, dh_criacao AS dhCriacao, dh_alteracao AS dhAlteracao \
FROM repertorio_projeto WHERE id_usuario = :idUsuario ORDER BY dh_alteracao DESC, id_projeto DESC

SPS.REPERTORIO.PROJETO=\
SELECT cd_chave AS cdChave, nm_titulo AS nmTitulo, dh_criacao AS dhCriacao, dh_alteracao AS dhAlteracao, tx_dados AS txDados \
FROM repertorio_projeto WHERE id_usuario = :idUsuario AND cd_chave = :chave

SPS.REPERTORIO.PROJETOS.CONTAR=\
SELECT COUNT(*) FROM repertorio_projeto WHERE id_usuario = :idUsuario

SPI.REPERTORIO.PROJETO=\
INSERT INTO repertorio_projeto (id_usuario, cd_chave, nm_titulo, tx_dados) VALUES (:idUsuario, :chave, :titulo, :dados) \
ON CONFLICT (id_usuario, cd_chave) DO UPDATE SET nm_titulo = EXCLUDED.nm_titulo, tx_dados = EXCLUDED.tx_dados, dh_alteracao = NOW()

SPD.REPERTORIO.PROJETO=\
DELETE FROM repertorio_projeto WHERE id_usuario = :idUsuario AND cd_chave = :chave
