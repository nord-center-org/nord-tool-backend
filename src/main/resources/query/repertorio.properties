## Repertório v7: músicas e criações do estúdio na conta.
## v16: a aba é aberta a todos: listar, abrir, salvar e trocar o áudio valem para qualquer pessoa (a chave é única no
## sistema); quem criou fica em id_usuario e quem mexeu por último em id_usuario_alteracao. Excluir, contar e somar o
## espaço continuam por quem criou.

SPS.REPERTORIO.MUSICAS=\
SELECT m.cd_chave AS cdChave, m.nm_titulo AS nmTitulo, m.nm_artista AS nmArtista, m.nm_arquivo AS nmArquivo, m.nr_tamanho_bytes AS nrTamanhoBytes, \
m.nr_duracao AS nrDuracao, m.nm_tom AS nmTom, m.nr_bpm AS nrBpm, m.cd_projeto AS cdProjeto, m.id_arquivo AS idArquivo, \
m.dh_criacao AS dhCriacao, m.dh_alteracao AS dhAlteracao, m.id_usuario AS idUsuario, uc.nm_nome AS nmCriador, ua.nm_nome AS nmAlterador, \
(m.id_usuario = :idUsuario) AS inMinha \
FROM repertorio_musica m JOIN usuario uc ON uc.id_usuario = m.id_usuario LEFT JOIN usuario ua ON ua.id_usuario = m.id_usuario_alteracao \
ORDER BY m.dh_alteracao DESC, m.id_musica DESC

SPS.REPERTORIO.MUSICA=\
SELECT m.cd_chave AS cdChave, m.nm_titulo AS nmTitulo, m.nm_artista AS nmArtista, m.nm_arquivo AS nmArquivo, m.nr_tamanho_bytes AS nrTamanhoBytes, \
m.nr_duracao AS nrDuracao, m.nm_tom AS nmTom, m.nr_bpm AS nrBpm, m.cd_projeto AS cdProjeto, m.id_arquivo AS idArquivo, \
m.dh_criacao AS dhCriacao, m.dh_alteracao AS dhAlteracao, m.id_usuario AS idUsuario, uc.nm_nome AS nmCriador, ua.nm_nome AS nmAlterador, \
(m.id_usuario = :idUsuario) AS inMinha, m.tx_dados AS txDados \
FROM repertorio_musica m JOIN usuario uc ON uc.id_usuario = m.id_usuario LEFT JOIN usuario ua ON ua.id_usuario = m.id_usuario_alteracao \
WHERE m.cd_chave = :chave

SPS.REPERTORIO.MUSICAS.CONTAR=\
SELECT COUNT(*) FROM repertorio_musica WHERE id_usuario = :idUsuario

SPS.REPERTORIO.BYTES=\
SELECT COALESCE(SUM(nr_tamanho_bytes), 0) FROM repertorio_musica \
WHERE id_usuario = :idUsuario AND id_arquivo IS NOT NULL AND (CAST(:exceto AS VARCHAR) IS NULL OR cd_chave <> :exceto)

SPI.REPERTORIO.MUSICA=\
INSERT INTO repertorio_musica (id_usuario, cd_chave, nm_titulo, nm_artista, nr_duracao, nm_tom, nr_bpm, cd_projeto, tx_dados, nm_arquivo) \
VALUES (:idUsuario, :chave, :titulo, :artista, :duracao, :tom, :bpm, :projeto, :dados, :arquivo) \
ON CONFLICT (cd_chave) DO UPDATE SET nm_titulo = EXCLUDED.nm_titulo, nm_artista = EXCLUDED.nm_artista, \
nr_duracao = EXCLUDED.nr_duracao, nm_tom = EXCLUDED.nm_tom, nr_bpm = EXCLUDED.nr_bpm, cd_projeto = EXCLUDED.cd_projeto, \
tx_dados = EXCLUDED.tx_dados, nm_arquivo = CASE WHEN repertorio_musica.id_arquivo IS NULL THEN EXCLUDED.nm_arquivo ELSE repertorio_musica.nm_arquivo END, \
id_usuario_alteracao = EXCLUDED.id_usuario, dh_alteracao = NOW()

SPU.REPERTORIO.AUDIO=\
UPDATE repertorio_musica SET id_arquivo = :idArquivo, nm_arquivo = :nome, nr_tamanho_bytes = :tamanho, \
id_usuario_alteracao = :idUsuario, dh_alteracao = NOW() WHERE cd_chave = :chave

SPD.REPERTORIO.MUSICA=\
DELETE FROM repertorio_musica WHERE id_usuario = :idUsuario AND cd_chave = :chave

SPS.REPERTORIO.PROJETOS=\
SELECT pr.cd_chave AS cdChave, pr.nm_titulo AS nmTitulo, pr.dh_criacao AS dhCriacao, pr.dh_alteracao AS dhAlteracao, \
pr.id_usuario AS idUsuario, uc.nm_nome AS nmCriador, ua.nm_nome AS nmAlterador, (pr.id_usuario = :idUsuario) AS inMinha \
FROM repertorio_projeto pr JOIN usuario uc ON uc.id_usuario = pr.id_usuario LEFT JOIN usuario ua ON ua.id_usuario = pr.id_usuario_alteracao \
ORDER BY pr.dh_alteracao DESC, pr.id_projeto DESC

SPS.REPERTORIO.PROJETO=\
SELECT pr.cd_chave AS cdChave, pr.nm_titulo AS nmTitulo, pr.dh_criacao AS dhCriacao, pr.dh_alteracao AS dhAlteracao, \
pr.id_usuario AS idUsuario, uc.nm_nome AS nmCriador, ua.nm_nome AS nmAlterador, (pr.id_usuario = :idUsuario) AS inMinha, pr.tx_dados AS txDados \
FROM repertorio_projeto pr JOIN usuario uc ON uc.id_usuario = pr.id_usuario LEFT JOIN usuario ua ON ua.id_usuario = pr.id_usuario_alteracao \
WHERE pr.cd_chave = :chave

SPS.REPERTORIO.PROJETOS.CONTAR=\
SELECT COUNT(*) FROM repertorio_projeto WHERE id_usuario = :idUsuario

SPI.REPERTORIO.PROJETO=\
INSERT INTO repertorio_projeto (id_usuario, cd_chave, nm_titulo, tx_dados) VALUES (:idUsuario, :chave, :titulo, :dados) \
ON CONFLICT (cd_chave) DO UPDATE SET nm_titulo = EXCLUDED.nm_titulo, tx_dados = EXCLUDED.tx_dados, id_usuario_alteracao = EXCLUDED.id_usuario, dh_alteracao = NOW()

SPD.REPERTORIO.PROJETO=\
DELETE FROM repertorio_projeto WHERE id_usuario = :idUsuario AND cd_chave = :chave

## ---------- Repertório v12: cifras compartilhadas ----------
## Cada destinatário tem a sua cópia; só ele vê, abre e exclui a dele.

SPI.REPERTORIO.CIFRA_ENVIADA=\
INSERT INTO repertorio_cifra_enviada (id_usuario_origem, id_usuario_destino, nm_titulo, nm_artista, nm_tom, tx_cifra, tx_mensagem) \
VALUES (:origem, :destino, :titulo, :artista, :tom, :cifra, :mensagem)

SPS.REPERTORIO.CIFRAS_ENVIADAS.CONTAR_DESDE=\
SELECT COUNT(*) FROM repertorio_cifra_enviada WHERE id_usuario_origem = :idUsuario AND dh_criacao >= :desde

SPS.REPERTORIO.CIFRAS_RECEBIDAS=\
SELECT c.id_cifra_enviada AS id, c.id_usuario_origem AS idUsuarioOrigem, u.nm_nome AS nmUsuarioOrigem, c.nm_titulo AS nmTitulo, \
c.nm_artista AS nmArtista, c.nm_tom AS nmTom, c.tx_mensagem AS txMensagem, c.dh_criacao AS dhCriacao, c.dh_leitura AS dhLeitura \
FROM repertorio_cifra_enviada c JOIN usuario u ON u.id_usuario = c.id_usuario_origem \
WHERE c.id_usuario_destino = :idUsuario ORDER BY c.dh_criacao DESC, c.id_cifra_enviada DESC LIMIT 300

SPS.REPERTORIO.CIFRA_RECEBIDA=\
SELECT c.id_cifra_enviada AS id, c.id_usuario_origem AS idUsuarioOrigem, u.nm_nome AS nmUsuarioOrigem, c.nm_titulo AS nmTitulo, \
c.nm_artista AS nmArtista, c.nm_tom AS nmTom, c.tx_mensagem AS txMensagem, c.dh_criacao AS dhCriacao, c.dh_leitura AS dhLeitura, \
c.tx_cifra AS txCifra \
FROM repertorio_cifra_enviada c JOIN usuario u ON u.id_usuario = c.id_usuario_origem \
WHERE c.id_usuario_destino = :idUsuario AND c.id_cifra_enviada = :id

SPU.REPERTORIO.CIFRA_LIDA=\
UPDATE repertorio_cifra_enviada SET dh_leitura = NOW() WHERE id_usuario_destino = :idUsuario AND id_cifra_enviada = :id AND dh_leitura IS NULL

SPD.REPERTORIO.CIFRA_RECEBIDA=\
DELETE FROM repertorio_cifra_enviada WHERE id_usuario_destino = :idUsuario AND id_cifra_enviada = :id
