## Obras e fases (administração).
SPS.OBRA.LISTAR=\
SELECT id_obra AS id, nm_obra AS nmObra, cd_acesso AS cdAcesso, in_ativo AS inAtivo, nr_versao AS nrVersao \
FROM obra ORDER BY LOWER(nm_obra)

SPS.OBRA.BUSCAR=\
SELECT id_obra AS id, nm_obra AS nmObra, cd_acesso AS cdAcesso, in_ativo AS inAtivo, nr_versao AS nrVersao \
FROM obra WHERE id_obra = :id

SPI.OBRA.INSERIR=\
INSERT INTO obra (nm_obra, cd_acesso, in_ativo) VALUES (:nmObra, :cdAcesso, :inAtivo) RETURNING id_obra

SPU.OBRA.ALTERAR=\
UPDATE obra SET nm_obra = :nmObra, cd_acesso = :cdAcesso, in_ativo = :inAtivo, nr_versao = nr_versao + 1 \
WHERE id_obra = :id AND nr_versao = :nrVersao

SPS.FASE.LISTAR=\
SELECT id_fase AS id, id_obra AS idObra, nm_fase AS nmFase, cd_fase AS cdFase, nr_ordem AS nrOrdem, \
in_ativo AS inAtivo, nr_versao AS nrVersao FROM fase ORDER BY id_obra, nr_ordem, LOWER(nm_fase)

SPS.FASE.BUSCAR=\
SELECT id_fase AS id, id_obra AS idObra, nm_fase AS nmFase, cd_fase AS cdFase, nr_ordem AS nrOrdem, \
in_ativo AS inAtivo, nr_versao AS nrVersao FROM fase WHERE id_fase = :id

SPI.FASE.INSERIR=\
INSERT INTO fase (id_obra, nm_fase, cd_fase, nr_ordem, in_ativo) VALUES (:idObra, :nmFase, :cdFase, :nrOrdem, :inAtivo) \
RETURNING id_fase

SPU.FASE.ALTERAR=\
UPDATE fase SET nm_fase = :nmFase, cd_fase = :cdFase, nr_ordem = :nrOrdem, in_ativo = :inAtivo, nr_versao = nr_versao + 1 \
WHERE id_fase = :id AND nr_versao = :nrVersao

SPS.FASE.USUARIOS=\
SELECT id_fase AS idFase, id_usuario AS idUsuario FROM usuario_fase ORDER BY id_fase, id_usuario

SPD.FASE.USUARIOS=\
DELETE FROM usuario_fase WHERE id_fase = :idFase

SPI.FASE.USUARIO=\
INSERT INTO usuario_fase (id_usuario, id_fase) VALUES (:idUsuario, :idFase)

SPS.FASE.CONTAR_USUARIOS=\
SELECT COUNT(*) FROM usuario WHERE id_usuario IN (:ids)
