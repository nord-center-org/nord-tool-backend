## ---------- pessoas ----------
SPS.FINANCEIRO.PESSOA.LISTAR=\
SELECT id_pessoa AS id, nm_pessoa AS nmPessoa, in_compartilhado AS inCompartilhado, id_usuario AS idUsuario, \
nr_ordem AS nrOrdem, in_ativo AS inAtivo \
FROM financeiro_pessoa ORDER BY nr_ordem, LOWER(nm_pessoa)

SPS.FINANCEIRO.PESSOA.BUSCAR=\
SELECT id_pessoa AS id, nm_pessoa AS nmPessoa, in_compartilhado AS inCompartilhado, id_usuario AS idUsuario, \
nr_ordem AS nrOrdem, in_ativo AS inAtivo \
FROM financeiro_pessoa WHERE id_pessoa = :id

SPI.FINANCEIRO.PESSOA.INSERIR=\
INSERT INTO financeiro_pessoa (nm_pessoa, in_compartilhado, id_usuario, nr_ordem, in_ativo) \
VALUES (:nmPessoa, :inCompartilhado, :idUsuario, :nrOrdem, :inAtivo)

SPU.FINANCEIRO.PESSOA.ALTERAR=\
UPDATE financeiro_pessoa SET nm_pessoa = :nmPessoa, in_compartilhado = :inCompartilhado, id_usuario = :idUsuario, \
nr_ordem = :nrOrdem, in_ativo = :inAtivo WHERE id_pessoa = :id

## ---------- categorias ----------
SPS.FINANCEIRO.CATEGORIA.LISTAR=\
SELECT id_categoria AS id, nm_categoria AS nmCategoria, cd_tipo AS cdTipo, cd_projecao AS cdProjecao, in_fixa AS inFixa, \
cd_regra_data AS cdRegraData, nr_dia AS nrDia, nr_ordem AS nrOrdem, in_ativo AS inAtivo \
FROM financeiro_categoria ORDER BY cd_tipo, nr_ordem, LOWER(nm_categoria)

SPS.FINANCEIRO.CATEGORIA.BUSCAR=\
SELECT id_categoria AS id, nm_categoria AS nmCategoria, cd_tipo AS cdTipo, cd_projecao AS cdProjecao, in_fixa AS inFixa, \
cd_regra_data AS cdRegraData, nr_dia AS nrDia, nr_ordem AS nrOrdem, in_ativo AS inAtivo \
FROM financeiro_categoria WHERE id_categoria = :id

SPI.FINANCEIRO.CATEGORIA.INSERIR=\
INSERT INTO financeiro_categoria (nm_categoria, cd_tipo, cd_projecao, in_fixa, cd_regra_data, nr_dia, nr_ordem, in_ativo) \
VALUES (:nmCategoria, :cdTipo, :cdProjecao, :inFixa, :cdRegraData, :nrDia, :nrOrdem, :inAtivo)

SPU.FINANCEIRO.CATEGORIA.ALTERAR=\
UPDATE financeiro_categoria SET nm_categoria = :nmCategoria, cd_tipo = :cdTipo, cd_projecao = :cdProjecao, \
in_fixa = :inFixa, cd_regra_data = :cdRegraData, nr_dia = :nrDia, nr_ordem = :nrOrdem, in_ativo = :inAtivo \
WHERE id_categoria = :id

SPS.FINANCEIRO.CATEGORIA.CONTAR_LANCAMENTOS=\
SELECT COUNT(*) FROM financeiro_lancamento WHERE id_categoria = :id

## ---------- lançamentos ----------
## A cláusula WHERE dos filtros e o ORDER BY são acrescentados pelo repositório.
SPS.FINANCEIRO.LANCAMENTO.LISTAR=\
SELECT l.id_lancamento AS id, l.cd_requisicao::text AS cdRequisicao, l.dt_competencia AS dtCompetencia, \
l.dt_lancamento AS dtLancamento, l.id_categoria AS idCategoria, c.nm_categoria AS nmCategoria, c.cd_tipo AS cdTipo, \
l.id_pessoa AS idPessoa, p.nm_pessoa AS nmPessoa, l.ds_lancamento AS dsLancamento, l.vl_lancamento AS vlLancamento, \
l.in_realizado AS inRealizado, l.nr_parcela AS nrParcela, l.qt_parcela AS qtParcela, \
l.id_usuario_criacao AS idUsuarioCriacao, u.nm_nome AS nmUsuarioCriacao, l.nr_versao AS nrVersao, \
l.dh_alteracao AS dhAlteracao \
FROM financeiro_lancamento l \
JOIN financeiro_categoria c ON c.id_categoria = l.id_categoria \
JOIN financeiro_pessoa p ON p.id_pessoa = l.id_pessoa \
LEFT JOIN usuario u ON u.id_usuario = l.id_usuario_criacao WHERE 1 = 1

SPS.FINANCEIRO.LANCAMENTO.BUSCAR=\
SELECT l.id_lancamento AS id, l.cd_requisicao::text AS cdRequisicao, l.dt_competencia AS dtCompetencia, \
l.dt_lancamento AS dtLancamento, l.id_categoria AS idCategoria, c.nm_categoria AS nmCategoria, c.cd_tipo AS cdTipo, \
l.id_pessoa AS idPessoa, p.nm_pessoa AS nmPessoa, l.ds_lancamento AS dsLancamento, l.vl_lancamento AS vlLancamento, \
l.in_realizado AS inRealizado, l.nr_parcela AS nrParcela, l.qt_parcela AS qtParcela, \
l.id_usuario_criacao AS idUsuarioCriacao, u.nm_nome AS nmUsuarioCriacao, l.nr_versao AS nrVersao, \
l.dh_alteracao AS dhAlteracao \
FROM financeiro_lancamento l \
JOIN financeiro_categoria c ON c.id_categoria = l.id_categoria \
JOIN financeiro_pessoa p ON p.id_pessoa = l.id_pessoa \
LEFT JOIN usuario u ON u.id_usuario = l.id_usuario_criacao \
WHERE l.id_lancamento = :id

SPS.FINANCEIRO.LANCAMENTO.BUSCAR_REQUISICAO=\
SELECT id_lancamento FROM financeiro_lancamento WHERE cd_requisicao = CAST(:cdRequisicao AS uuid)

## Devolve 0 linhas quando o cd_requisicao já existe (reenvio): o serviço devolve o lançamento original.
SPI.FINANCEIRO.LANCAMENTO.INSERIR=\
INSERT INTO financeiro_lancamento (cd_requisicao, dt_competencia, dt_lancamento, id_categoria, id_pessoa, \
ds_lancamento, vl_lancamento, in_realizado, nr_parcela, qt_parcela, id_usuario_criacao, id_recorrencia) \
VALUES (CAST(:cdRequisicao AS uuid), :dtCompetencia, :dtLancamento, :idCategoria, :idPessoa, \
:dsLancamento, :vlLancamento, :inRealizado, :nrParcela, :qtParcela, :idUsuarioCriacao, :idRecorrencia) \
ON CONFLICT (cd_requisicao) DO NOTHING RETURNING id_lancamento

## Só altera se a versão ainda for a que o cliente viu; devolve o nº de linhas (0 = conflito ou inexistente).
SPU.FINANCEIRO.LANCAMENTO.ALTERAR=\
UPDATE financeiro_lancamento SET dt_competencia = :dtCompetencia, dt_lancamento = :dtLancamento, \
id_categoria = :idCategoria, id_pessoa = :idPessoa, ds_lancamento = :dsLancamento, vl_lancamento = :vlLancamento, \
in_realizado = :inRealizado, nr_versao = nr_versao + 1, dh_alteracao = now() \
WHERE id_lancamento = :id AND nr_versao = :nrVersao

SPU.FINANCEIRO.LANCAMENTO.REALIZADO=\
UPDATE financeiro_lancamento SET in_realizado = :inRealizado, nr_versao = nr_versao + 1, dh_alteracao = now() \
WHERE id_lancamento = :id AND nr_versao = :nrVersao

SPD.FINANCEIRO.LANCAMENTO.DELETAR=\
DELETE FROM financeiro_lancamento WHERE id_lancamento = :id AND nr_versao = :nrVersao

## Resumo: a cláusula WHERE dos filtros é acrescentada pelo repositório.
SPS.FINANCEIRO.LANCAMENTO.RESUMO=\
SELECT \
COALESCE(SUM(l.vl_lancamento) FILTER (WHERE c.cd_tipo = 'ENTRADA'), 0) AS entradas, \
COALESCE(SUM(l.vl_lancamento) FILTER (WHERE c.cd_tipo = 'SAIDA'), 0) AS saidas, \
COALESCE(SUM(l.vl_lancamento) FILTER (WHERE c.cd_tipo = 'ENTRADA' AND l.in_realizado), 0) AS entradasRealizadas, \
COALESCE(SUM(l.vl_lancamento) FILTER (WHERE c.cd_tipo = 'SAIDA' AND l.in_realizado), 0) AS saidasRealizadas, \
COUNT(*) AS qtLancamentos, \
COUNT(*) FILTER (WHERE l.in_realizado) AS qtRealizados \
FROM financeiro_lancamento l \
JOIN financeiro_categoria c ON c.id_categoria = l.id_categoria \
JOIN financeiro_pessoa p ON p.id_pessoa = l.id_pessoa WHERE 1 = 1
