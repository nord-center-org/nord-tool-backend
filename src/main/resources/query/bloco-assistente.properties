## Bloco de notas v4: o chat dos cadernos lê o Bloco de notas da pessoa (só leitura). Tudo filtra pelo dono.

SPS.BLOCO.ASSISTENTE.CATALOGO=\
SELECT * FROM ( \
  SELECT 'CADERNO' AS cdTipo, c.id_caderno AS id, c.nm_titulo AS nmTitulo, c.dh_alteracao AS dhAlteracao, \
  (SELECT COUNT(*) FROM bloco_pagina p WHERE p.id_caderno = c.id_caderno) AS qtPaginas \
  FROM bloco_caderno c WHERE c.id_usuario = :idUsuario \
  UNION ALL \
  SELECT a.cd_tipo, a.id_arquivo_bloco, a.nm_titulo, a.dh_alteracao, NULL \
  FROM bloco_arquivo a WHERE a.id_usuario = :idUsuario \
) t ORDER BY dhAlteracao DESC, id DESC LIMIT :limite

## Páginas só quando têm caixa de texto (o JSON das páginas é gravado sem espaços); o número da página conta todas.
SPS.BLOCO.ASSISTENTE.TRECHOS=\
SELECT * FROM ( \
  SELECT 'PAGINA' AS cdTipo, p.id_caderno AS id, p.nm_titulo AS nmTitulo, p.id_pagina AS idPagina, p.nrPagina, \
  p.dh_alteracao AS dhAlteracao, p.tx_conteudo AS conteudo \
  FROM ( \
    SELECT pg.id_caderno, c.nm_titulo, pg.id_pagina, pg.dh_alteracao, pg.tx_conteudo, \
    CAST(ROW_NUMBER() OVER (PARTITION BY pg.id_caderno ORDER BY pg.nr_ordem, pg.id_pagina) AS INTEGER) AS nrPagina \
    FROM bloco_pagina pg JOIN bloco_caderno c ON c.id_caderno = pg.id_caderno \
    WHERE c.id_usuario = :idUsuario \
  ) p WHERE p.tx_conteudo LIKE '%"t":"tx"%' AND LENGTH(p.tx_conteudo) <= 2000000 \
  UNION ALL \
  SELECT 'DOCUMENTO_CADERNO', c.id_caderno, c.nm_titulo, NULL, NULL, c.dh_alteracao, c.tx_documento \
  FROM bloco_caderno c WHERE c.id_usuario = :idUsuario AND COALESCE(c.tx_documento, '') <> '' AND LENGTH(c.tx_documento) <= 2000000 \
  UNION ALL \
  SELECT a.cd_tipo, a.id_arquivo_bloco, a.nm_titulo, NULL, NULL, a.dh_alteracao, a.tx_conteudo \
  FROM bloco_arquivo a WHERE a.id_usuario = :idUsuario AND a.tx_conteudo <> '' AND LENGTH(a.tx_conteudo) <= 2000000 \
) t ORDER BY dhAlteracao DESC, id DESC LIMIT :limite
